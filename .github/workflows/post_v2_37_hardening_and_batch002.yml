name: post_v2_37_hardening_and_batch002

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-and-batch002:
    name: post-v2.37 hardening, batch002-batch022 clean replication continuation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TARGETED_PROSPECTIVE_SEED_PATH: external_seeds_pending/targeted_prospective_seed_batch013.json

    steps:
      - name: Checkout ControllerGate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run byte-custody preflight before hardening
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Install workflow test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run shared core and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/core tests/runtime -q

      - name: Generate post-v2.37 hardening evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/post_v2_37_hardening_and_batch002_runner.py

      - name: Run byte-custody preflight before audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Validate registry and audits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_external_candidate_registry.py
          python scripts/audit_post_v2_37_hardening_and_batch002.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run

      - name: Verify clean staged artifact payload
        shell: bash
        run: |
          set -euo pipefail
          test -f artifact_payload/post_v2_37_hardening_batch022_docker_era_psa82_thin/ARTIFACT_SHA256SUMS.txt
          if find artifact_payload/post_v2_37_hardening_batch022_docker_era_psa82_thin \( \
            -path '*/__pycache__/*' -o \
            -path '*/.pytest_cache/*' -o \
            -path '*/.mypy_cache/*' -o \
            -path '*/.ruff_cache/*' -o \
            -path '*/.venv/*' -o \
            -path '*/venv/*' -o \
            -path '*/env/*' -o \
            -path '*/ENV/*' -o \
            -name '*.pyc' -o \
            -name '*.pyo' -o \
            -name '*.zip' -o \
            -name '*.tar' -o \
            -name '*.tar.gz' -o \
            -name '*.tgz' -o \
            -name '*.7z' \
          \) -print -quit | grep -q .; then
            echo "artifact_packaging_cache_payload_detected"
            exit 1
          fi
          if find artifact_payload/post_v2_37_hardening_batch022_docker_era_psa82_thin -type d -name 'clean_replication_batch_*' ! -name 'clean_replication_batch_022' -print -quit | grep -q .; then
            echo "recursive_prior_batch_packaging_detected"
            exit 1
          fi

      - name: Upload Batch022 Docker provider and Structured Fragility Audit thin post-v2.37 hardening artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch022_docker_era_psa82_thin_artifacts
          path: |
            artifact_payload/post_v2_37_hardening_batch022_docker_era_psa82_thin/**
          if-no-files-found: error
