name: post_v2_37_hardening_and_batch002

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-and-batch002:
    name: post-v2.37 hardening, batch002-batch043 clean replication continuation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TARGETED_PROSPECTIVE_SEED_PATH: external_seeds_pending/targeted_prospective_seed_batch013.json

    steps:
      - name: Checkout ControllerGate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run byte-custody preflight before hardening
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Install workflow test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run shared core and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/core tests/runtime -q

      - name: Generate post-v2.37 hardening evidence
        shell: bash
        env:
          CONTROLLERGATE_ENABLE_DOCKER_PROVIDER: "1"
        run: |
          set -euo pipefail
          python scripts/post_v2_37_hardening_and_batch002_runner.py

      - name: Run byte-custody preflight before audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Validate registry and audits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_external_candidate_registry.py
          python scripts/audit_post_v2_37_hardening_and_batch002.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          git diff --check
          python - <<'PY'
          import json
          state = json.load(open("outputs/clean_replication_batch_041/consolidated_state_clean_replication_batch_041.json", encoding="utf-8"))
          keys = [
              "status",
              "exact_blocker",
              "batch040_artifact_verification_status",
              "stable_identity_integrity_status",
              "proof_ledger_referrer_audit_status",
              "cofactor_lock_provenance_status",
              "dependency_drift_audit_status",
              "lock_completion_status",
              "lock_v2_review_status",
              "provider_only_materialization_status",
              "post_repair_target_replay_status",
              "duplicate_clean_replay_status",
              "issue_derived_repair_validated",
          ]
          for key in keys:
              print(f"batch041_{key}={state.get(key)}")
          PY
          python - <<'PY'
          import json
          state = json.load(open("outputs/clean_replication_batch_042/consolidated_state_clean_replication_batch_042.json", encoding="utf-8"))
          keys = [
              "status",
              "exact_blocker",
              "batch041_artifact_verification_status",
              "repair_validation_preservation_status",
              "issue_derived_episode_count_gate_status",
              "issue_derived_repair_episode_count_before_batch042",
              "issue_derived_repair_episode_count_after_batch042",
              "native_external_repair_episode_count",
              "stable_identity_lineage_lock_status",
              "proof_ledger_validation_lock_status",
              "replay_classification_preservation_status",
              "stale_blocker_retirement_status",
              "full_scoring",
              "memory_lift",
              "self_maintaining_software",
          ]
          for key in keys:
              print(f"batch042_{key}={state.get(key)}")
          PY
          python - <<'PY'
          import json
          state = json.load(open("outputs/clean_replication_batch_043/consolidated_state_clean_replication_batch_043.json", encoding="utf-8"))
          keys = [
              "status",
              "exact_blocker",
              "batch042_artifact_verification_status",
              "batch042_count_lock_preservation_status",
              "canonical_episode_record_status",
              "protocolization_audit_status",
              "isomorphic_coverage_matrix_status",
              "reusable_episode_schema_status",
              "protocol_guardrail_update_status",
              "stale_blocker_lane_closure_status",
              "issue_derived_repair_episode_count",
              "native_external_repair_episode_count",
              "full_scoring",
              "memory_lift",
              "self_maintaining_software",
          ]
          for key in keys:
              print(f"batch043_{key}={state.get(key)}")
          PY

      - name: Verify clean staged artifact payload
        shell: bash
        run: |
          set -euo pipefail
          test -f artifact_payload/post_v2_37_hardening_batch043_episode_canonicalization_protocolization/ARTIFACT_SHA256SUMS.txt
          if find artifact_payload/post_v2_37_hardening_batch043_episode_canonicalization_protocolization \( \
            -path '*/__pycache__/*' -o \
            -path '*/.pytest_cache/*' -o \
            -path '*/.mypy_cache/*' -o \
            -path '*/.ruff_cache/*' -o \
            -path '*/.venv/*' -o \
            -path '*/venv/*' -o \
            -path '*/env/*' -o \
            -path '*/ENV/*' -o \
            -name '*.pyc' -o \
            -name '*.pyo' -o \
            -name '*.zip' -o \
            -name '*.tar' -o \
            -name '*.tar.gz' -o \
            -name '*.tgz' -o \
            -name '*.7z' \
          \) -print -quit | grep -q .; then
            echo "artifact_packaging_cache_payload_detected"
            exit 1
          fi
          if find artifact_payload/post_v2_37_hardening_batch043_episode_canonicalization_protocolization -type d -name 'clean_replication_batch_*' ! -name 'clean_replication_batch_043' -print -quit | grep -q .; then
            echo "recursive_prior_batch_packaging_detected"
            exit 1
          fi

      - name: Upload Batch043 episode canonicalization protocolization artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch043_episode_canonicalization_protocolization_artifacts
          path: |
            artifact_payload/post_v2_37_hardening_batch043_episode_canonicalization_protocolization/**
          if-no-files-found: error
