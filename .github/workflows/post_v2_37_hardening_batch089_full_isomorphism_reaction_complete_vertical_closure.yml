name: post_v2_37_hardening_batch089_full_isomorphism_reaction_complete_vertical_closure

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OUTPUT: outputs/post_v2_37_hardening_batch089_full_isomorphism_reaction_complete_vertical_closure
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  custody_and_contracts:
    name: A custody, expected-red, and composite contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python - <<'PY'
          import json, os
          root=os.environ['OUTPUT']
          custody=json.load(open(f'{root}/batch088_artifact_sha256_verification.json'))
          assert custody['status']=='PASS'
          assert custody['observed']=={'sha256':'6e04eeb145d851556ba66defd1fe842a5230ee9fcdd4e50755e0bb7e039bc72b','size_bytes':116600,'zip_entries':69}
          expected=[
            (f'{root}/batch089_pre_fix_expected_failure.json','BATCH089_PRE_FIX_AUDIT_FAIL_EXPECTED'),
            (f'{root}/prompt2_signal_cargo_homeostasis/prompt2_pre_fix_expected_failure.json','BATCH089_PROMPT2_PRE_FIX_AUDIT_FAIL_EXPECTED'),
            (f'{root}/prompt3_replication_repair_defense_actuation/prompt3_pre_fix_expected_failure.json','BATCH089_PROMPT3_PRE_FIX_AUDIT_FAIL_EXPECTED')]
          for path,status in expected: assert json.load(open(path))['status']==status
          composite=json.load(open('configs/batch089_composite_prompt_contract.json'))
          assert len(composite['prompt_ids'])==len(composite['sentinels'])==3 and composite['unique_requirement_count']==78
          PY

  kernel_tests:
    name: B durable kernel, control plane, and adversarial tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_batch089_reaction_kernel.py tests/test_batch089_control_plane.py tests/test_batch089_product_services.py tests/test_batch089_doctor_contracts_and_state.py -q
      - run: python -m pytest -q

  historical_capsules:
    name: C bounded historical capsule transport and consumer evidence
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build wheel setuptools packaging
      - name: Acquire and consume registered Cloudpickle capsule pair
        run: |
          python scripts/batch088_capsule_transport.py --candidate cloudpickle --mode source --destination "$RUNNER_TEMP/cloudpickle-source"
          python scripts/batch088_capsule_transport.py --candidate cloudpickle --mode provider --destination "$RUNNER_TEMP/cloudpickle-provider"
          python scripts/batch088_consume_capsules.py --candidate cloudpickle --source "$RUNNER_TEMP/cloudpickle-source" --provider "$RUNNER_TEMP/cloudpickle-provider" --output "$RUNNER_TEMP/consumer-evidence"
      - name: Acquire and consume registered Freezegun capsule pair
        run: |
          python scripts/batch088_capsule_transport.py --candidate freezegun --mode source --destination "$RUNNER_TEMP/freezegun-source"
          python scripts/batch088_capsule_transport.py --candidate freezegun --mode provider --destination "$RUNNER_TEMP/freezegun-provider"
          python scripts/batch088_consume_capsules.py --candidate freezegun --source "$RUNNER_TEMP/freezegun-source" --provider "$RUNNER_TEMP/freezegun-provider" --output "$RUNNER_TEMP/consumer-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: batch089_short_lived_historical_capsule_consumer_evidence
          path: ${{ runner.temp }}/consumer-evidence
          retention-days: 1

  linux_installed_product:
    name: D Linux installed-product validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build pytest
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: controllergate doctor --deep --repo-root . --json "$RUNNER_TEMP/linux-doctor.json"
      - run: python -c "import json,os; p=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'linux-doctor.json'))); assert p['status']=='PASS' and p['deep']['status']=='PASS'"

  windows_installed_product:
    name: E Windows installed-product validation
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build pytest
      - run: python -m build --wheel
      - shell: pwsh
        run: |
          $wheel=(Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          python -m pip install --force-reinstall $wheel
          controllergate doctor --deep --repo-root . --json "$env:RUNNER_TEMP\windows-doctor.json"
          $report=Get-Content "$env:RUNNER_TEMP\windows-doctor.json" | ConvertFrom-Json
          if($report.status -ne 'PASS' -or $report.deep.status -ne 'PASS'){ throw 'deep doctor failed' }
      - run: python -m pytest tests/test_batch089_product_services.py tests/test_batch089_control_plane.py -q

  composite_execution_and_critic:
    name: F composite execution, independent critic, and portable packaging
    needs: [custody_and_contracts, kernel_tests, historical_capsules, linux_installed_product, windows_installed_product]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . pytest
      - uses: actions/download-artifact@v4
        with:
          name: batch089_short_lived_historical_capsule_consumer_evidence
          path: ${{ runner.temp }}/historical-consumer-evidence
      - name: Execute all three prompt pathways
        run: |
          python scripts/run_batch089_composite.py
          cp "$RUNNER_TEMP"/historical-consumer-evidence/*.json "$OUTPUT"/
          python scripts/audit_batch089_mempalace_shadow.py
          python scripts/generate_batch089_public_state.py
      - name: Regression and current-protocol authority
        run: |
          python scripts/validate_external_candidate_registry.py
          python scripts/audit_v2_19_authorized_amds_active_maintenance.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          python scripts/audit_installed_product_reachability.py
          python scripts/audit_canonical_component_uniqueness.py
          python scripts/audit_public_language.py
          python scripts/audit_batch089_security_and_sbom.py
      - name: Independent composite critic and manifests
        run: |
          python scripts/audit_batch089_full_isomorphism_reaction_complete_vertical_closure.py --emit
          python scripts/finalize_batch089_manifests.py
          python scripts/byte_custody_preflight.py
          python scripts/audit_batch089_full_isomorphism_reaction_complete_vertical_closure.py --verify-manifests
          git diff --check
      - name: Stage portable main artifact
        run: |
          STAGE="$RUNNER_TEMP/batch089-main-artifact"
          mkdir -p "$STAGE"
          cp -a "$OUTPUT"/. "$STAGE"/
          if find "$STAGE" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' \) | grep -q .; then exit 1; fi
          if find "$STAGE" -type d \( -name '__pycache__' -o -name '.venv' -o -name 'venv' \) | grep -q .; then exit 1; fi
          (cd "$STAGE" && find . -type f ! -name ARTIFACT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > ARTIFACT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch089_full_isomorphism_reaction_complete_vertical_closure_artifacts
          path: ${{ runner.temp }}/batch089-main-artifact
          retention-days: 30
