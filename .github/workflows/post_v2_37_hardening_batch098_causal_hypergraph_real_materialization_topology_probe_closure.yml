      - uses: actions/download-artifact@v4
        with: {pattern: "batch098-architecture-arm-*", path: "${{ runner.temp }}/experiments/arms"}
      - uses: actions/download-artifact@v4
        with: {pattern: "batch098-baseline-*", path: "${{ runner.temp }}/experiments/baselines"}
      - uses: actions/download-artifact@v4
        with: {name: batch098-sealed-truth, path: "${{ runner.temp }}/truth"}
      - run: python scripts/batch098_workflow_stage.py truth-join --source "$RUNNER_TEMP/experiments" --truth "$RUNNER_TEMP/truth" --output "$CG_RUNTIME/quality"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-truth-join-quality, path: "${{ runner.temp }}/controllergate-runtime/quality", retention-days: 1}

  source_ownership_producers:
    needs: [cohort_join, terminal_seal, local_brot_verifiers]
