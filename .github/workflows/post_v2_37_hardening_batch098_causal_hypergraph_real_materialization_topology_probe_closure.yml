      - run: python scripts/batch098_workflow_stage.py source-ownership-produce --source "$RUNNER_TEMP/cohort/darker_issue_112_relative_git_dir/candidate_lane_result_v2.json" --terminal "$RUNNER_TEMP/terminals/batch098-amds-darker_issue_112_relative_git_dir/terminal.json" --topology "$RUNNER_TEMP/topology" --output "$CG_RUNTIME/source-ownership-produced"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-source-ownership-producers, path: "${{ runner.temp }}/controllergate-runtime/source-ownership-produced", retention-days: 1}

  source_ownership_verifiers:
    needs: source_ownership_producers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-source-ownership-producers, path: "${{ runner.temp }}/ownership"}
      - run: python scripts/batch098_workflow_stage.py source-ownership-verify --source "$RUNNER_TEMP/ownership" --output "$CG_RUNTIME/source-ownership-verified"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-source-ownership-verifiers, path: "${{ runner.temp }}/controllergate-runtime/source-ownership-verified", retention-days: 1}

