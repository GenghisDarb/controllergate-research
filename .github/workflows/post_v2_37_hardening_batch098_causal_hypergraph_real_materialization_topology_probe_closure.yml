      - uses: actions/upload-artifact@v4
        with: {name: "batch098-baseline-${{ matrix.baseline }}", path: "${{ runner.temp }}/controllergate-runtime/baseline-${{ matrix.baseline }}", retention-days: 1}

  truth_join_and_historical_quality:
    needs: [sealed_truth_custody, terminal_seal, architecture_arms, baseline_executions]
    runs-on: ubuntu-latest
    steps:
