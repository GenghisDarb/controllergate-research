name: post_v2_37_hardening_batch098_causal_hypergraph_real_materialization_topology_probe_closure

on:
  workflow_dispatch:
    inputs:
      batch097_artifact_id:
        description: Exact official Batch097 Actions artifact ID
        required: true
        default: "8424390383"
      tld_source_artifact_id:
        description: Exact controllergate_batch098_exact_tld_source_bundle Actions artifact ID
        required: true

permissions:
  actions: read
  contents: read

env:
  CG_RUNTIME: ${{ runner.temp }}/controllergate-runtime
  CG_CONTRACTS: ${{ github.workspace }}/configs/candidate_execution_contracts_v2.jsonl

jobs:
  batch097_artifact_custody:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Acquire official Batch097 bytes by artifact ID
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ inputs.batch097_artifact_id }}/zip" > "$RUNNER_TEMP/batch097.zip"
      - name: Verify Batch097 exact artifact identity
        run: python scripts/verify_batch097_official_artifact.py --artifact "$RUNNER_TEMP/batch097.zip" --output "$CG_RUNTIME/batch097-custody"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-batch097-custody, path: "${{ runner.temp }}/controllergate-runtime/batch097-custody", retention-days: 1}

  tld_source_artifact_custody:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Acquire the one-time custody artifact only
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ inputs.tld_source_artifact_id }}/zip" > "$RUNNER_TEMP/tld-transport.zip"
          python -c "import zipfile,pathlib; z=zipfile.ZipFile(r'$RUNNER_TEMP/tld-transport.zip'); n=[x for x in z.namelist() if x.endswith('.zip')]; assert len(n)==1; pathlib.Path(r'$RUNNER_TEMP/tld.zip').write_bytes(z.read(n[0]))"
      - name: Reverify exact raw TLD identity
        run: python scripts/verify_batch098_tld_source_bundle.py --bundle "$RUNNER_TEMP/tld.zip" --output "$CG_RUNTIME/tld-custody/tld_custody.json"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-tld-custody-report, path: "${{ runner.temp }}/controllergate-runtime/tld-custody", retention-days: 1}

  expected_red_and_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install . pytest pyyaml
      - run: python scripts/audit_batch098_pre_dispatch_real_depth.py --verify-seal
      - run: python -m pytest -q
      - run: python scripts/audit_batch097_evidence_reconstitution_real_repository_genome_topology_amds.py
      - run: python scripts/controllergate_audit.py --protocol current
      - run: python scripts/controllergate_run.py --protocol current --dry-run

  sealed_controllergate_wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip wheel . --no-deps --wheel-dir "$CG_RUNTIME/wheel"
      - run: python -c "import hashlib,json,pathlib; p=next(pathlib.Path(r'$CG_RUNTIME/wheel').glob('*.whl')); (p.parent/'wheel_seal.json').write_text(json.dumps({'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'name':p.name},sort_keys=True))"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-sealed-controllergate-wheel, path: "${{ runner.temp }}/controllergate-runtime/wheel", retention-days: 1}

  sealed_candidate_contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python scripts/build_batch098_candidate_contracts.py
      - uses: actions/upload-artifact@v4
        with: {name: batch098-sealed-candidate-contracts, path: configs/candidate_execution_contracts_v2.jsonl, retention-days: 1}

  materialization:
    needs: [batch097_artifact_custody, tld_source_artifact_custody, expected_red_and_regression, sealed_controllergate_wheel, sealed_candidate_contracts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {candidate: darker_issue_112_relative_git_dir, os: ubuntu-latest, provider_python: "3.7"}
          - {candidate: py_bugger_issue_65, os: ubuntu-latest, provider_python: "3.11"}
          - {candidate: cloudpickle_507_py313_typevar_distutils, os: ubuntu-latest, provider_python: "3.13"}
          - {candidate: freezegun_547_py313_datetimes_assertion, os: ubuntu-latest, provider_python: "3.13"}
          - {candidate: audioread_144_py313_aifc_removed, os: ubuntu-latest, provider_python: "3.13"}
          - {candidate: pytest_13480_wdefault_unraisable_threadexception, os: ubuntu-latest, provider_python: "3.13"}
          - {candidate: incident_openbb_7585_modular_openapi_reproducer, os: ubuntu-latest, provider_python: "3.11"}
          - {candidate: incident_poetry_10974_init_duplicate_name, os: windows-latest, provider_python: "3.11"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        id: provider
        with: {python-version: "${{ matrix.provider_python }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {name: batch098-sealed-controllergate-wheel, path: "${{ runner.temp }}/wheel"}
      - shell: bash
        run: python -m pip install "$RUNNER_TEMP"/wheel/controllergate-*.whl
      - name: Execute one installed candidate and every registered control
        shell: bash
        run: |
          controllergate evidence materialize-candidate --contracts "$CG_CONTRACTS" --candidate "${{ matrix.candidate }}" --runtime-root "$CG_RUNTIME" --output "$RUNNER_TEMP/candidate/${{ matrix.candidate }}" --provider-python "${{ steps.provider.outputs.python-path }}" --forbidden-repo-root "$GITHUB_WORKSPACE" --run-id "$GITHUB_RUN_ID-${{ matrix.candidate }}"
      - uses: actions/upload-artifact@v4
        with: {name: "batch098-candidate-${{ matrix.candidate }}", path: "${{ runner.temp }}/candidate/${{ matrix.candidate }}", retention-days: 1}

  cohort_join:
    needs: materialization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {pattern: batch098-candidate-*, path: "${{ runner.temp }}/candidate-artifacts"}
      - run: python scripts/batch098_workflow_stage.py normalize-candidates --source "$RUNNER_TEMP/candidate-artifacts" --output "$CG_RUNTIME/cohort"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-cohort, path: "${{ runner.temp }}/controllergate-runtime/cohort", retention-days: 1}

  independent_incident_verification:
    needs: cohort_join
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-cohort, path: "${{ runner.temp }}/cohort"}
      - run: python scripts/batch098_workflow_stage.py incident-verify --source "$RUNNER_TEMP/cohort" --output "$CG_RUNTIME/incidents"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-independent-incidents, path: "${{ runner.temp }}/controllergate-runtime/incidents", retention-days: 1}

  role_producers:
    needs: independent_incident_verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-cohort, path: "${{ runner.temp }}/cohort"}
      - run: python scripts/batch098_workflow_stage.py role-produce --source "$RUNNER_TEMP/cohort" --output "$CG_RUNTIME/roles-produced"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-role-producers, path: "${{ runner.temp }}/controllergate-runtime/roles-produced", retention-days: 1}

  independent_role_verifiers:
    needs: role_producers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-role-producers, path: "${{ runner.temp }}/roles"}
      - run: python scripts/batch098_workflow_stage.py role-verify --source "$RUNNER_TEMP/roles" --output "$CG_RUNTIME/roles-verified"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-role-verifiers, path: "${{ runner.temp }}/controllergate-runtime/roles-verified", retention-days: 1}

  bulb_producers:
    needs: [cohort_join, independent_role_verifiers]
    strategy: {fail-fast: false, matrix: {candidate: [darker_issue_112_relative_git_dir, py_bugger_issue_65, cloudpickle_507_py313_typevar_distutils, freezegun_547_py313_datetimes_assertion, audioread_144_py313_aifc_removed, pytest_13480_wdefault_unraisable_threadexception, incident_openbb_7585_modular_openapi_reproducer, incident_poetry_10974_init_duplicate_name]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-cohort, path: "${{ runner.temp }}/cohort"}
      - run: controllergate topology produce --candidate-evidence "$RUNNER_TEMP/cohort/${{ matrix.candidate }}" --contracts "$CG_CONTRACTS" --output "$CG_RUNTIME/bulb/${{ matrix.candidate }}"
      - uses: actions/upload-artifact@v4
        with: {name: "batch098-bulb-producer-${{ matrix.candidate }}", path: "${{ runner.temp }}/controllergate-runtime/bulb/${{ matrix.candidate }}", retention-days: 1}

  bulb_verifiers:
    needs: bulb_producers
    strategy: {fail-fast: false, matrix: {candidate: [darker_issue_112_relative_git_dir, py_bugger_issue_65, cloudpickle_507_py313_typevar_distutils, freezegun_547_py313_datetimes_assertion, audioread_144_py313_aifc_removed, pytest_13480_wdefault_unraisable_threadexception, incident_openbb_7585_modular_openapi_reproducer, incident_poetry_10974_init_duplicate_name]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-cohort, path: "${{ runner.temp }}/cohort"}
      - uses: actions/download-artifact@v4
        with: {name: "batch098-bulb-producer-${{ matrix.candidate }}", path: "${{ runner.temp }}/producer"}
      - run: controllergate topology verify --candidate-evidence "$RUNNER_TEMP/cohort/${{ matrix.candidate }}" --producer-evidence "$RUNNER_TEMP/producer" --output "$CG_RUNTIME/bulb-verified/${{ matrix.candidate }}"
      - uses: actions/upload-artifact@v4
        with: {name: "batch098-bulb-verifier-${{ matrix.candidate }}", path: "${{ runner.temp }}/controllergate-runtime/bulb-verified/${{ matrix.candidate }}", retention-days: 1}

  local_brot_producers:
    needs: bulb_verifiers
    strategy: {fail-fast: false, matrix: {candidate: [darker_issue_112_relative_git_dir, py_bugger_issue_65, cloudpickle_507_py313_typevar_distutils, freezegun_547_py313_datetimes_assertion, audioread_144_py313_aifc_removed, pytest_13480_wdefault_unraisable_threadexception, incident_openbb_7585_modular_openapi_reproducer, incident_poetry_10974_init_duplicate_name]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-cohort, path: "${{ runner.temp }}/cohort"}
      - run: controllergate topology produce --candidate-evidence "$RUNNER_TEMP/cohort/${{ matrix.candidate }}" --contracts "$CG_CONTRACTS" --output "$CG_RUNTIME/brot/${{ matrix.candidate }}"
      - uses: actions/upload-artifact@v4
        with: {name: "batch098-brot-producer-${{ matrix.candidate }}", path: "${{ runner.temp }}/controllergate-runtime/brot/${{ matrix.candidate }}", retention-days: 1}

  local_brot_verifiers:
    needs: local_brot_producers
    strategy: {fail-fast: false, matrix: {candidate: [darker_issue_112_relative_git_dir, py_bugger_issue_65, cloudpickle_507_py313_typevar_distutils, freezegun_547_py313_datetimes_assertion, audioread_144_py313_aifc_removed, pytest_13480_wdefault_unraisable_threadexception, incident_openbb_7585_modular_openapi_reproducer, incident_poetry_10974_init_duplicate_name]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-cohort, path: "${{ runner.temp }}/cohort"}
      - uses: actions/download-artifact@v4
        with: {name: "batch098-brot-producer-${{ matrix.candidate }}", path: "${{ runner.temp }}/producer"}
      - run: controllergate topology verify --candidate-evidence "$RUNNER_TEMP/cohort/${{ matrix.candidate }}" --producer-evidence "$RUNNER_TEMP/producer" --output "$CG_RUNTIME/brot-verified/${{ matrix.candidate }}"
      - uses: actions/upload-artifact@v4
        with: {name: "batch098-brot-verifier-${{ matrix.candidate }}", path: "${{ runner.temp }}/controllergate-runtime/brot-verified/${{ matrix.candidate }}", retention-days: 1}

  projection_side_execution:
    needs: local_brot_producers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: batch098-brot-producer-*, path: "${{ runner.temp }}/projections"}
      - uses: actions/upload-artifact@v4
        with: {name: batch098-projection-sides, path: "${{ runner.temp }}/projections", retention-days: 1}

  projection_verification:
    needs: [projection_side_execution, local_brot_verifiers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: batch098-brot-verifier-*, path: "${{ runner.temp }}/projection-verifiers"}
      - uses: actions/upload-artifact@v4
        with: {name: batch098-projection-verification, path: "${{ runner.temp }}/projection-verifiers", retention-days: 1}

  modality_producers:
    needs: local_brot_producers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: batch098-brot-producer-*, path: "${{ runner.temp }}/modalities"}
      - uses: actions/upload-artifact@v4
        with: {name: batch098-modality-producers, path: "${{ runner.temp }}/modalities", retention-days: 1}

  modality_verification_and_conflict_join:
    needs: [modality_producers, local_brot_verifiers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: batch098-brot-verifier-*, path: "${{ runner.temp }}/modality-verifiers"}
      - uses: actions/upload-artifact@v4
        with: {name: batch098-modality-verifiers, path: "${{ runner.temp }}/modality-verifiers", retention-days: 1}

  causal_board_and_probe_compilation:
    needs: [projection_verification, modality_verification_and_conflict_join]
    strategy: {fail-fast: false, matrix: {candidate: [darker_issue_112_relative_git_dir, py_bugger_issue_65, cloudpickle_507_py313_typevar_distutils, freezegun_547_py313_datetimes_assertion, audioread_144_py313_aifc_removed, pytest_13480_wdefault_unraisable_threadexception, incident_openbb_7585_modular_openapi_reproducer, incident_poetry_10974_init_duplicate_name]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-cohort, path: "${{ runner.temp }}/cohort"}
      - uses: actions/download-artifact@v4
        with: {name: "batch098-brot-verifier-${{ matrix.candidate }}", path: "${{ runner.temp }}/verified"}
      - run: controllergate topology compile-board --candidate-evidence "$RUNNER_TEMP/cohort/${{ matrix.candidate }}" --verified-topology "$RUNNER_TEMP/verified" --contracts "$CG_CONTRACTS" --output "$CG_RUNTIME/frames/${{ matrix.candidate }}"
      - uses: actions/upload-artifact@v4
        with: {name: "batch098-frame-${{ matrix.candidate }}", path: "${{ runner.temp }}/controllergate-runtime/frames/${{ matrix.candidate }}", retention-days: 1}

  independent_frame_verification:
    needs: causal_board_and_probe_compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {pattern: batch098-frame-*, path: "${{ runner.temp }}/frames"}
      - run: python scripts/batch098_workflow_stage.py frame-verify --source "$RUNNER_TEMP/frames" --output "$CG_RUNTIME/frame-verification"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-frame-verification, path: "${{ runner.temp }}/controllergate-runtime/frame-verification", retention-days: 1}

  tld_raw_source_shadow_processing:
    needs: tld_source_artifact_custody
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ inputs.tld_source_artifact_id }}/zip" > "$RUNNER_TEMP/tld-transport.zip"
          python -c "import zipfile,pathlib; z=zipfile.ZipFile(r'$RUNNER_TEMP/tld-transport.zip'); n=[x for x in z.namelist() if x.endswith('.zip')]; pathlib.Path(r'$RUNNER_TEMP/tld.zip').write_bytes(z.read(n[0]))"
          python scripts/parse_batch098_tld_bundle.py --bundle "$RUNNER_TEMP/tld.zip" --output "$CG_RUNTIME/tld-shadow" --custody-depth ci
      - uses: actions/upload-artifact@v4
        with: {name: batch098-tld-shadow, path: "${{ runner.temp }}/controllergate-runtime/tld-shadow", retention-days: 1}

  sealed_truth_custody:
    needs: [independent_incident_verification, tld_raw_source_shadow_processing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - run: python scripts/batch098_workflow_stage.py truth-custody --output "$CG_RUNTIME/sealed-truth"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-sealed-truth, path: "${{ runner.temp }}/controllergate-runtime/sealed-truth", retention-days: 1}

  truth_blind_amds_candidate_groups:
    needs: independent_frame_verification
    strategy:
      fail-fast: false
      matrix:
        candidate: [darker_issue_112_relative_git_dir, py_bugger_issue_65, cloudpickle_507_py313_typevar_distutils, freezegun_547_py313_datetimes_assertion, audioread_144_py313_aifc_removed, pytest_13480_wdefault_unraisable_threadexception, incident_openbb_7585_modular_openapi_reproducer, incident_poetry_10974_init_duplicate_name]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: "batch098-frame-${{ matrix.candidate }}", path: "${{ runner.temp }}/frame"}
      - run: python scripts/batch098_workflow_stage.py dpp-candidate --frame "$RUNNER_TEMP/frame/topology_compiled_decision_frame_v3.json" --output "$CG_RUNTIME/amds/${{ matrix.candidate }}"
      - uses: actions/upload-artifact@v4
        with: {name: "batch098-amds-${{ matrix.candidate }}", path: "${{ runner.temp }}/controllergate-runtime/amds/${{ matrix.candidate }}", retention-days: 1}

  terminal_seal:
    needs: truth_blind_amds_candidate_groups
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: batch098-amds-*, path: "${{ runner.temp }}/terminals"}
      - shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path(r'${{ runner.temp }}/terminals')
          files=sorted(root.rglob('terminal.json'))
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          (root/'terminal_seal.json').write_text(json.dumps({'status':'PASS','terminals':len(files),'seal':hashlib.sha256(json.dumps(manifest,sort_keys=True).encode()).hexdigest()},sort_keys=True))
          assert len(files)==8
          PY
      - uses: actions/upload-artifact@v4
        with: {name: batch098-terminal-seal, path: "${{ runner.temp }}/terminals", retention-days: 1}

  architecture_arms:
    needs: terminal_seal
    strategy: {fail-fast: false, matrix: {arm: [A, B, C, D, E, F]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-frame-darker_issue_112_relative_git_dir, path: "${{ runner.temp }}/frame"}
      - run: python scripts/batch098_workflow_stage.py experiment --frame "$RUNNER_TEMP/frame/topology_compiled_decision_frame_v3.json" --experiment-id "${{ matrix.arm }}" --output "$CG_RUNTIME/arm-${{ matrix.arm }}"
      - uses: actions/upload-artifact@v4
        with: {name: "batch098-architecture-arm-${{ matrix.arm }}", path: "${{ runner.temp }}/controllergate-runtime/arm-${{ matrix.arm }}", retention-days: 1}

  baseline_executions:
    needs: terminal_seal
    strategy: {fail-fast: false, matrix: {baseline: [G, H, I, J]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: batch098-frame-darker_issue_112_relative_git_dir, path: "${{ runner.temp }}/frame"}
