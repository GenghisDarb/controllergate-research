        with: {name: batch098-resigned-complete-raw-tree-mutations, path: "${{ runner.temp }}/controllergate-runtime/resigned-mutations/mutation_results.json", retention-days: 1}

  public_state_and_main_artifact:
    needs: [batch097_artifact_custody, tld_source_artifact_custody, expected_red_and_regression, independent_incident_verification, independent_role_verifiers, independent_frame_verification, terminal_seal, truth_join_and_historical_quality, source_ownership_verifiers, standalone_standard_library_critic, seal_breaking_mutations, resigned_complete_raw_tree_mutations]
