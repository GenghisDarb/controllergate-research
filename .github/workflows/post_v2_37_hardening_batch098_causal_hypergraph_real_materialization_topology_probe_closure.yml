      - uses: actions/download-artifact@v4
        with: {pattern: "batch098-*", path: "${{ runner.temp }}/raw", merge-multiple: false}
      - run: python scripts/batch098_workflow_stage.py seal-tree --source "$RUNNER_TEMP/raw" --output "$CG_RUNTIME/raw-seal"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-complete-raw-evidence, path: "${{ runner.temp }}/raw", retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: batch098-complete-raw-seal, path: "${{ runner.temp }}/controllergate-runtime/raw-seal", retention-days: 1}

  standalone_standard_library_critic:
    needs: complete_raw_evidence_seal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {name: batch098-complete-raw-evidence, path: "${{ runner.temp }}/raw"}
      - run: python -I scripts/batch098_standalone_critic_v7.py --raw-evidence "$RUNNER_TEMP/raw" --output "$CG_RUNTIME/critic/critic.json"
      - uses: actions/upload-artifact@v4
        with: {name: batch098-standalone-critic, path: "${{ runner.temp }}/controllergate-runtime/critic", retention-days: 1}

  seal_breaking_mutations:
