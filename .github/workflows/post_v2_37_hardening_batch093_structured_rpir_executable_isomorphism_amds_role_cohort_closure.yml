name: post_v2_37_hardening_batch093_structured_rpir_executable_isomorphism_amds_role_cohort_closure

on:
  workflow_dispatch:
    inputs:
      run_historical_actuation:
        description: Historical non-counting actuation (still blocked unless every upstream gate passes)
        type: boolean
        required: false
        default: false
      cloudpickle_patch_confirmation:
        description: Exact externally approved Cloudpickle patch SHA256
        type: string
        required: false
      freezegun_patch_confirmation:
        description: Exact externally approved Freezegun patch SHA256
        type: string
        required: false

permissions:
  contents: read
  actions: read

env:
  OUTPUT: outputs/post_v2_37_hardening_batch093_structured_rpir_executable_isomorphism_amds_role_cohort_closure
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  custody_structured_rpir:
    name: 01-10 custody, exact release-97 source, RPIR v2, compiler, and cohort freeze
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install pytest build wheel setuptools packaging
      - name: Acquire exact official Batch092 and Batch091 reference artifacts
        run: |
          RUNTIME="$RUNNER_TEMP/controllergate-runtime"
          mkdir -p "$RUNTIME/inputs"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/8358022260/zip" \
            -o "$RUNTIME/inputs/batch092.zip"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/8353766243/zip" \
            -o "$RUNTIME/inputs/batch091-reference.zip"
          python scripts/batch093_ingest_and_reconcile_batch092.py \
            --artifact "$RUNTIME/inputs/batch092.zip" \
            --batch091-reference "$RUNTIME/inputs/batch091-reference.zip" \
            --output "$OUTPUT"
      - name: Verify sealed expected-red audit
        run: |
          echo "b5d7433c00c0ea2de2df4a16523a7a5be04ed2e089e5af5a4e6e32be8213f09a  $OUTPUT/batch093_pre_fix_structured_rpir_and_role_cohort_expected_failure.json" | sha256sum --check
          python - <<'PY'
          import json, os, pathlib
          value=json.loads((pathlib.Path(os.environ["OUTPUT"])/"batch093_pre_fix_structured_rpir_and_role_cohort_expected_failure.json").read_text())
          assert value["status"]=="BATCH093_PRE_FIX_AUDIT_FAIL_EXPECTED" and value["finding_count"]==27
          PY
      - name: Acquire exact Reactome release-97 structured sources and rebuild RPIR v2
        run: |
          RUNTIME="$RUNNER_TEMP/controllergate-runtime"
          python scripts/acquire_reactome97_structured.py --output-root "$RUNTIME/reactome97"
          python scripts/run_batch093_structured_rpir.py \
            --mysql-dump "$RUNTIME/reactome97/gk_current.sql.gz" \
            --database "$RUNTIME/reactome97/reactome97-core.sqlite" \
            --reaction-occurrences outputs/post_v2_37_hardening_batch092_reactome_complete_pathway_ir_external_review_correction/reactome_reactions.jsonl \
            --pathway-occurrences outputs/post_v2_37_hardening_batch092_reactome_complete_pathway_ir_external_review_correction/reactome_pathways.jsonl \
            --source-manifest "$RUNTIME/reactome97/reactome-release97-structured-source-manifest.json" \
            --output "$OUTPUT"
          python scripts/run_batch093_structural_compiler.py \
            --rpir "$OUTPUT/reactome_structured_rpir_v2_reactions.jsonl" \
            --output "$OUTPUT"
      - name: Freeze fresh role cohort and enforce upstream block
        run: |
          mkdir -p "$RUNNER_TEMP/controllergate-runtime/historical-capsules"
          python scripts/run_batch093_role_cohort_gate.py \
            --cohort configs/batch093_amds_frozen_cohort.json \
            --capsule-root "$RUNNER_TEMP/controllergate-runtime/historical-capsules" \
            --legacy-contract configs/batch091_amds_measurement_contracts.json \
            --output "$OUTPUT"
      - run: python -m pytest tests/test_batch093_structured_rpir.py tests/test_batch093_rpir_migration.py tests/test_batch093_executable_isomorphism.py tests/test_batch093_amds_role_cohort.py -q
      - run: python scripts/audit_canonical_component_uniqueness.py
      - run: python scripts/audit_no_batch_core_logic.py
      - run: python scripts/audit_public_language.py
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: batch093_structured_builder_evidence
          path: ${{ env.OUTPUT }}
          retention-days: 1

  installed_linux:
    name: 11-15 Linux installed-wheel canonical chapter execution
    needs: custody_structured_rpir
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install build wheel setuptools packaging
      - uses: actions/download-artifact@v4
        with: {name: batch093_structured_builder_evidence, path: batch093-builder}
      - name: Build, install, and execute without checkout import leakage
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/controllergate-wheel"
          python -m venv "$RUNNER_TEMP/controllergate-installed"
          "$RUNNER_TEMP/controllergate-installed/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/controllergate-wheel/controllergate-*.whl
          env -u PYTHONPATH "$RUNNER_TEMP/controllergate-installed/bin/python" "$GITHUB_WORKSPACE/scripts/run_batch093_installed_scenarios.py" \
            --scenarios "$GITHUB_WORKSPACE/batch093-builder/reactome_chapter_scenario_registry_v2.jsonl" \
            --integrated "$GITHUB_WORKSPACE/batch093-builder/reactome_structured_cross_chapter_scenario.json" \
            --database "$RUNNER_TEMP/controllergate-runtime/linux/state.sqlite3" \
            --platform linux \
            --output "$RUNNER_TEMP/reactome_chapter_scenario_results_linux.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: batch093_reactome_linux_installed_evidence
          path: ${{ runner.temp }}/reactome_chapter_scenario_results_linux.jsonl
          retention-days: 1

  installed_windows:
    name: 16-20 Windows installed-wheel canonical chapter execution
    needs: custody_structured_rpir
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Enable preserved historical paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install build wheel setuptools packaging
      - uses: actions/download-artifact@v4
        with: {name: batch093_structured_builder_evidence, path: batch093-builder}
      - name: Build, install, and execute without checkout import leakage
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps -w "$env:RUNNER_TEMP\controllergate-wheel"
          python -m venv "$env:RUNNER_TEMP\controllergate-installed"
          $wheel = Get-ChildItem "$env:RUNNER_TEMP\controllergate-wheel\controllergate-*.whl" | Select-Object -First 1
          & "$env:RUNNER_TEMP\controllergate-installed\Scripts\python.exe" -m pip install --no-deps $wheel.FullName
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          & "$env:RUNNER_TEMP\controllergate-installed\Scripts\python.exe" "$env:GITHUB_WORKSPACE\scripts\run_batch093_installed_scenarios.py" `
            --scenarios "$env:GITHUB_WORKSPACE\batch093-builder\reactome_chapter_scenario_registry_v2.jsonl" `
            --integrated "$env:GITHUB_WORKSPACE\batch093-builder\reactome_structured_cross_chapter_scenario.json" `
            --database "$env:RUNNER_TEMP\controllergate-runtime\windows\state.sqlite3" `
            --platform windows `
            --output "$env:RUNNER_TEMP\reactome_chapter_scenario_results_windows.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: batch093_reactome_windows_installed_evidence
          path: ${{ runner.temp }}/reactome_chapter_scenario_results_windows.jsonl
          retention-days: 1

  final:
    name: 21-32 cross-platform join, raw critic, regressions, and compact handoff
    needs: [custody_structured_rpir, installed_linux, installed_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install pytest build wheel setuptools packaging
      - uses: actions/download-artifact@v4
        with: {name: batch093_structured_builder_evidence, path: cross-platform/builder}
      - uses: actions/download-artifact@v4
        with: {name: batch093_reactome_linux_installed_evidence, path: cross-platform/linux}
      - uses: actions/download-artifact@v4
        with: {name: batch093_reactome_windows_installed_evidence, path: cross-platform/windows}
      - name: Join installed evidence and run bounded critic/finalizer
        run: |
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"
          cp -a cross-platform/builder/. "$OUTPUT/"
          cp cross-platform/linux/reactome_chapter_scenario_results_linux.jsonl "$OUTPUT/"
          cp cross-platform/windows/reactome_chapter_scenario_results_windows.jsonl "$OUTPUT/"
          python scripts/batch093_standalone_critic.py --output "$OUTPUT" --workspace "$RUNNER_TEMP/controllergate-runtime/batch093-critic-mutations"
          python scripts/finalize_batch093.py --repo . --output "$OUTPUT"
      - run: python -m pytest -q
      - name: Batch073 through Batch092 preservation audits
        run: |
          python scripts/audit_batch073_count5_revalidation_frozen_wave1.py
          python scripts/audit_batch074_sterile_high_yield_amds_memory_wave1.py
          python scripts/audit_batch075_provider_harness_amds_memory_wave1a.py
          python scripts/audit_batch076_amds_causal_memory_calibration.py
          python scripts/audit_batch077_typed_event_pathway_memory_v2.py
          python scripts/audit_batch078_count6_minimal_closure_memory_wave1b.py
          python scripts/audit_batch079_count6_runtime_incident_memory_wave1c.py
          python scripts/audit_batch080_executed_preflight_provider_memory_wave1d.py
          python scripts/audit_batch081_execution_constitution_provider_incident_pilot.py
          python scripts/audit_batch082_ci_native_maintenance_order_provider_wave1f.py --output outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
          python scripts/audit_batch083_reaction_product_cross_area_wave1g.py --out outputs/post_v2_37_hardening_batch083_reaction_product_cross_area_wave1g
          python scripts/audit_batch084_real_amds_canary_product_beta.py --out outputs/post_v2_37_hardening_batch084_real_amds_canary_product_beta
          python scripts/audit_batch085_canonical_kernel_product_beta_rc.py
          python scripts/audit_batch086_historical_lifecycle_dpp14_product_beta_rc.py
          python scripts/audit_batch087_canonical_execution_blind_dpp14_product_beta_revalidation.py --verify-only
          python scripts/audit_batch088_causal_amds_historical_capsule_product_beta_closure.py
          python scripts/audit_batch089_full_isomorphism_reaction_complete_vertical_closure.py --verify-manifests
          python scripts/audit_batch090_evidence_delaundering_installed_vertical_closure.py --official-reconciliation
          python scripts/audit_batch091_lossless_capsule_blinded_amds_historical_canary_semantic_critic_closure.py
          python scripts/audit_batch092_reactome_complete_pathway_ir_external_review_correction.py
      - name: Current authority, custody, and Batch093 audits
        run: |
          python scripts/audit_v2_18_evidence_derived_topology_historical_provider.py
          python scripts/audit_v2_19_authorized_amds_active_maintenance.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          python scripts/audit_canonical_component_uniqueness.py
          python scripts/audit_no_batch_core_logic.py
          python scripts/audit_installed_product_reachability.py
          python scripts/audit_no_legacy_production_imports.py
          python scripts/audit_external_operation_boundaries.py
          python scripts/audit_public_language.py
          python scripts/audit_batch089_security_and_sbom.py --verify-only
          python scripts/audit_batch093_structured_rpir_executable_isomorphism_amds_role_cohort_closure.py --require-cross-platform
          python scripts/byte_custody_preflight.py
          git diff --check
      - name: Stage compact main artifact
        run: |
          STAGE="$RUNNER_TEMP/batch093-main"
          mkdir -p "$STAGE/outputs" "$STAGE/docs" "$STAGE/controllergate_v1_7_beta/reports/critic_review_package"
          cp -a "$OUTPUT" "$STAGE/outputs/"
          cp docs/current_status.md docs/capability_inventory.md docs/public_release_readiness.md "$STAGE/docs/"
          cp controllergate_v1_7_beta/reports/critic_review_package/shareable_summary.md "$STAGE/controllergate_v1_7_beta/reports/critic_review_package/"
          if find "$STAGE" -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tgz' -o -name '*.pdf' -o -name '*.whl' -o -name '*.sqlite*' -o -name '*.owl' -o -name '*.pyc' -o -name '*.pyo' \) | grep -q .; then exit 1; fi
          if find "$STAGE" -type d \( -name '__pycache__' -o -name '.git' -o -name 'site-packages' \) | grep -q .; then exit 1; fi
          (cd "$STAGE" && find . -type f ! -name 'ARTIFACT_SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > ARTIFACT_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch093_structured_rpir_executable_isomorphism_amds_role_cohort_closure_artifacts
          path: ${{ runner.temp }}/batch093-main
