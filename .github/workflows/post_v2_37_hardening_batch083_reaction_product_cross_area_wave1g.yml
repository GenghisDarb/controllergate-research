name: post_v2_37_hardening_batch083_reaction_product_cross_area_wave1g

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  RESULT: post_v2_37_hardening_batch083_reaction_product_cross_area_wave1g

jobs:
  verify-starting-state-and-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          test "$(git branch --show-current)" = "controllergate-v1.7-alpha-real-trace-pilot"
          test ! -e "outputs/$RESULT"
          python - <<'PY'
          import json
          p=json.load(open('configs/batch083_prompt_contract.json'))
          assert p['prompt_id']=='CG-BATCH083-INTEGRATED-REACTION-PRODUCT-ADVANCEMENT-2026-07-14-V1'
          assert p['prompt_sentinel']=='BEGIN_BATCH083_INTEGRATED_CONTINUATION'
          assert p['old_batch_rerun_forbidden'] is True
          PY
      - run: python scripts/audit_loose_end_registry.py
      - run: python scripts/audit_engineering_constitution_v3.py

  verify-batch082-provider-input-artifacts:
    needs: verify-starting-state-and-prompt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Download exact numeric artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/controllergate-runtime/artifact-store"
          for id in 8295240189 8295240545 8295255269; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/controllergate-runtime/artifact-store/$id.zip"
          done
      - run: python scripts/batch083_ci_stage.py artifacts --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime" --store "$RUNNER_TEMP/controllergate-runtime/artifact-store" --verified "$RUNNER_TEMP/controllergate-runtime/verified"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-artifact-binding-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: batch083-prior-verified-input-bytes, path: "${{ runner.temp }}/controllergate-runtime/verified", retention-days: 2, if-no-files-found: error, include-hidden-files: true}

  prepare-reaction-and-product-state:
    needs: verify-starting-state-and-prompt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/batch083_ci_stage.py prepare --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - run: python scripts/batch083_ci_stage.py network --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - run: python -m pytest tests/core/test_batch083_reaction_core.py tests/governance/test_batch083_prompt_registry.py -q
      - uses: actions/upload-artifact@v4
        with: {name: batch083-prepared-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  openbb-provider-v4:
    needs: verify-batch082-provider-input-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with: {name: batch083-prior-verified-input-bytes, path: "${{ runner.temp }}/verified"}
      - run: python scripts/batch083_ci_stage.py provider-openbb --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime" --verified "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-openbb-provider-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: batch083_openbb_linux_py311_complete_provider, path: "${{ runner.temp }}/controllergate-runtime/batch083_openbb_provider_payload", if-no-files-found: error}

  poetry-provider-v4:
    needs: verify-batch082-provider-input-artifacts
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {name: batch083-prior-verified-input-bytes, path: "${{ runner.temp }}/verified"}
      - shell: pwsh
        run: python scripts/batch083_ci_stage.py provider-poetry --out "$env:RUNNER_TEMP\evidence" --runtime "$env:RUNNER_TEMP\controllergate-runtime" --verified "$env:RUNNER_TEMP\verified"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-poetry-provider-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: batch083_poetry_windows_py313_complete_provider, path: "${{ runner.temp }}/controllergate-runtime/batch083_poetry_provider_payload", if-no-files-found: error}

  openbb-rooted-input:
    needs: verify-batch082-provider-input-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with: {name: batch083-prior-verified-input-bytes, path: "${{ runner.temp }}/verified"}
      - run: python scripts/batch083_ci_stage.py openapi --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime" --verified "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-openapi-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: batch083_openbb_rooted_openapi_reference_closure, path: "${{ runner.temp }}/controllergate-runtime/batch083_openapi_closure_payload", if-no-files-found: error}

  openbb-duplicate-reproduction:
    needs: [prepare-reaction-and-product-state, openbb-provider-v4, openbb-rooted-input]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with: {name: batch083_openbb_linux_py311_complete_provider, path: "${{ runner.temp }}/provider"}
      - uses: actions/download-artifact@v4
        with: {name: batch083_openbb_rooted_openapi_reference_closure, path: "${{ runner.temp }}/input"}
      - run: python scripts/batch083_ci_stage.py reproduce-openbb --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime" --provider-payload "$RUNNER_TEMP/provider" --input-payload "$RUNNER_TEMP/input"
      - run: python -c "import json,os; p=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'evidence','batch083_openbb_duplicate_reproduction.json'))); assert p['status'] in {'CANDIDATE_FAILURE_REPRODUCED','BLOCKED_EXACT_WITH_NEW_EVIDENCE'}"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-openbb-reproduction-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  poetry-duplicate-reproduction:
    needs: [prepare-reaction-and-product-state, poetry-provider-v4]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {name: batch083_poetry_windows_py313_complete_provider, path: "${{ runner.temp }}/provider"}
      - shell: pwsh
        run: python scripts/batch083_ci_stage.py reproduce-poetry --out "$env:RUNNER_TEMP\evidence" --runtime "$env:RUNNER_TEMP\controllergate-runtime" --provider-payload "$env:RUNNER_TEMP\provider"
      - shell: pwsh
        run: python -c "import json,os; p=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'evidence','batch083_poetry_duplicate_reproduction.json'))); assert p['status'] in {'CANDIDATE_FAILURE_REPRODUCED','BLOCKED_EXACT_WITH_NEW_EVIDENCE'}"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-poetry-reproduction-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  historical-amds-blind-challenge:
    needs: prepare-reaction-and-product-state
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/batch083_ci_stage.py historical --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-historical-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  historical-canary-health-rollback:
    needs: historical-amds-blind-challenge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: batch083-historical-evidence, path: "${{ runner.temp }}/evidence"}
      - run: python -c "import json,os; p=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'evidence','batch083_historical_canary_health_rollback.json'))); assert p['episode_count']>=2 and p['rollback_drills']>=2"

  offline-connector-canary:
    needs: prepare-reaction-and-product-state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python scripts/batch083_ci_stage.py connectors --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-offline-connector-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  public-readonly-connector-pilot:
    needs: prepare-reaction-and-product-state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python scripts/batch083_ci_stage.py public-connector --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-public-connector-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  candidate-pathway-and-ownership:
    needs: [openbb-duplicate-reproduction, poetry-duplicate-reproduction, prepare-reaction-and-product-state]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: "batch083-*-evidence", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - run: python scripts/batch083_ci_stage.py candidate --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-candidate-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  diagnostic-comparison-or-single-pilot:
    needs: [candidate-pathway-and-ownership, historical-amds-blind-challenge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: "batch083-*-evidence", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - run: python scripts/batch083_ci_stage.py diagnostic --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-diagnostic-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  matched-nulls-when-eligible:
    needs: diagnostic-comparison-or-single-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: "batch083-*-evidence", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - run: python scripts/batch083_ci_stage.py matched-nulls --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-null-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  blinded-ground-truth:
    needs: matched-nulls-when-eligible
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: "batch083-*-evidence", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - run: python scripts/batch083_ci_stage.py ground-truth --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-groundtruth-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  conditional-repair-authorization:
    needs: blinded-ground-truth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: "batch083-*-evidence", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - run: python scripts/batch083_ci_stage.py authorization --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-authorization-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  conditional-platform-repair:
    needs: conditional-repair-authorization
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: "batch083-*-evidence", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - run: python scripts/batch083_ci_stage.py repair --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-repair-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  duplicate-replay-proof-count-and-canary:
    needs: conditional-platform-repair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {pattern: "batch083-*-evidence", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - run: python scripts/batch083_ci_stage.py count --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-count-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  controlled-product-alpha-cycle:
    needs: prepare-reaction-and-product-state
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e .
      - run: controllergate doctor --runtime-root "$RUNNER_TEMP/controllergate-runtime"
      - run: python scripts/batch083_ci_stage.py product --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-product-evidence, path: "${{ runner.temp }}/evidence", retention-days: 2, if-no-files-found: error}

  independent-critic:
    needs: [verify-batch082-provider-input-artifacts, openbb-provider-v4, poetry-provider-v4, openbb-rooted-input, diagnostic-comparison-or-single-pilot, matched-nulls-when-eligible, blinded-ground-truth, conditional-repair-authorization, conditional-platform-repair, duplicate-replay-proof-count-and-canary, historical-canary-health-rollback, offline-connector-canary, public-readonly-connector-pilot, controlled-product-alpha-cycle]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with: {pattern: "batch083-*-evidence", path: "${{ runner.temp }}/critic-workspace/evidence", merge-multiple: true}
      - run: python scripts/batch083_ci_stage.py finalize --out "$RUNNER_TEMP/critic-workspace/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - run: cp controllergate/evaluation/batch083_independent_critic.py "$RUNNER_TEMP/critic-workspace/critic-source.py"
      - run: python scripts/batch083_independent_critic.py --evidence "$RUNNER_TEMP/critic-workspace/evidence" --output "$RUNNER_TEMP/critic-workspace/evidence/batch083_independent_critic.json"
      - run: python scripts/batch083_ci_stage.py finalize --out "$RUNNER_TEMP/critic-workspace/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - uses: actions/upload-artifact@v4
        with: {name: batch083-critic-complete-evidence, path: "${{ runner.temp }}/critic-workspace/evidence", retention-days: 2, if-no-files-found: error}

  capability-maturity-adjudication:
    needs: independent-critic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: batch083-critic-complete-evidence, path: "${{ runner.temp }}/evidence"}
      - run: python scripts/audit_capability_maturity.py --report "$RUNNER_TEMP/evidence/batch083_capability_maturity_after.json"
      - run: python scripts/audit_engineering_constitution_v3.py --proof-dir "$RUNNER_TEMP/evidence/batch083_constitution_v3_law_proofs"

  final-audit-and-package:
    needs: [capability-maturity-adjudication, independent-critic]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest pyyaml
      - uses: actions/download-artifact@v4
        with: {name: batch083-critic-complete-evidence, path: "outputs/${{ env.RESULT }}"}
      - run: python scripts/batch083_ci_stage.py finalize --out "outputs/$RESULT" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - run: python scripts/audit_reaction_completeness.py --out "outputs/$RESULT"
      - run: python scripts/audit_provider_closure_v4.py --out "outputs/$RESULT"
      - run: python scripts/audit_batch083_reaction_product_cross_area_wave1g.py --out "outputs/$RESULT"
      - run: python scripts/audit_loose_end_registry.py
      - run: python scripts/audit_engineering_constitution_v3.py --proof-dir "outputs/$RESULT/batch083_constitution_v3_law_proofs"
      - run: python scripts/audit_capability_maturity.py --report "outputs/$RESULT/batch083_capability_maturity_after.json"
      - run: python -m pytest tests -q
      - name: Preservation and current-boundary audits
        run: |
          python scripts/audit_batch082_ci_native_maintenance_order_provider_wave1f.py --output outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
          python scripts/audit_batch081_execution_constitution_provider_incident_pilot.py
          python scripts/audit_batch080_executed_preflight_provider_memory_wave1d.py
          python scripts/audit_batch079_count6_runtime_incident_memory_wave1c.py
          python scripts/audit_batch078_count6_minimal_closure_memory_wave1b.py
          python scripts/audit_batch077_typed_event_pathway_memory_v2.py
          python scripts/audit_batch076_amds_causal_memory_calibration.py
          python scripts/audit_batch075_provider_harness_amds_memory_wave1a.py
          python scripts/audit_batch074_sterile_high_yield_amds_memory_wave1.py
          python scripts/audit_batch073_count5_revalidation_frozen_wave1.py
          python scripts/audit_v2_18_evidence_derived_topology_historical_provider.py
          python scripts/audit_v2_19_authorized_amds_active_maintenance.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          python scripts/controllergate_frontier.py validate
          python scripts/audit_public_language.py
          python scripts/audit_public_frontier_sync.py
          python scripts/run_local_controllergate_demo.py
      - run: git diff --check
      - name: Reject provider, archive, cache, and compiled payloads
        run: |
          if find "outputs/$RESULT" -type f \( -name '*.whl' -o -name '*.zip' -o -name '*.tar' -o -name '*.pyc' -o -name '*.pyo' \) | grep -q .; then exit 1; fi
          if find "outputs/$RESULT" -type d \( -name '__pycache__' -o -name '.venv' \) | grep -q .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch083_reaction_product_cross_area_wave1g_artifacts
          path: outputs/post_v2_37_hardening_batch083_reaction_product_cross_area_wave1g
          if-no-files-found: error
          retention-days: 30
