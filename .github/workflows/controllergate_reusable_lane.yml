name: controllergate_reusable_lane

on:
  workflow_call:
    inputs:
      lane_id:
        required: true
        type: string
      runner_script:
        required: true
        type: string
      audit_script:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      run_regressions:
        required: false
        type: boolean
        default: true
      regression_level:
        required: false
        type: string
        default: standard
      run_core_tests:
        required: false
        type: boolean
        default: true
      python_version:
        required: false
        type: string
        default: "3.11"
      regression_registry_path:
        required: false
        type: string
        default: ""
      core_test_scope:
        required: false
        type: string
        default: full
      focused_test_targets:
        required: false
        type: string
        default: ""
      artifact_output_directory:
        required: false
        type: string
        default: ""
      artifact_include_policy:
        required: false
        type: string
        default: standard
  workflow_dispatch:
    inputs:
      lane_id:
        description: Lane identifier.
        required: true
        type: string
      runner_script:
        description: Python runner script path.
        required: true
        type: string
      audit_script:
        description: Python audit script path.
        required: true
        type: string
      artifact_name:
        description: Uploaded artifact name.
        required: true
        type: string
      run_regressions:
        description: Run selected regression audits.
        required: true
        type: boolean
        default: true
      regression_level:
        description: Regression level.
        required: true
        type: choice
        options:
          - minimal
          - standard
          - full
        default: standard
      run_core_tests:
        description: Run shared core unit tests.
        required: true
        type: boolean
        default: true
      python_version:
        description: Supported Python version.
        required: false
        type: string
        default: "3.11"
      regression_registry_path:
        description: Optional registry-driven regression audit path.
        required: false
        type: string
        default: ""
      core_test_scope:
        description: Core test scope.
        required: false
        type: choice
        options:
          - full
          - focused
        default: full
      focused_test_targets:
        description: Optional whitespace-separated focused pytest targets run before the shared suite.
        required: false
        type: string
        default: ""
      artifact_output_directory:
        description: Output directory basename; defaults to lane_id.
        required: false
        type: string
        default: ""
      artifact_include_policy:
        description: Artifact include policy label.
        required: false
        type: string
        default: standard

permissions:
  contents: read

jobs:
  controllergate-lane:
    name: controllergate reusable lane
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout ControllerGate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Run byte-custody preflight before lane execution
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Install workflow test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run shared core tests
        if: ${{ inputs.run_core_tests }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.core_test_scope }}" == "focused" ]]; then
            python -m pytest tests/core/test_batch068g_frontier_engine.py -q
          else
            python -m pytest tests/core tests/runtime -q
          fi

      - name: Run lane-focused tests
        if: ${{ inputs.focused_test_targets != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest ${{ inputs.focused_test_targets }} -q

      - name: Run lane runner
        shell: bash
        run: |
          set -euo pipefail
          python "${{ inputs.runner_script }}"

      - name: Run byte-custody preflight before lane audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Validate external candidate registry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_external_candidate_registry.py

      - name: Run lane audit
        shell: bash
        run: |
          set -euo pipefail
          python "${{ inputs.audit_script }}"

      - name: Run selected regressions
        if: ${{ inputs.run_regressions }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.regression_registry_path }}" ]]; then
            python scripts/run_controllergate_regression_audits.py --registry "${{ inputs.regression_registry_path }}"
          else
            python scripts/audit_v2_36_resolved_commit_replay_seed_promotion.py
            if [[ "${{ inputs.regression_level }}" != "minimal" ]]; then
              python scripts/audit_v2_35_automated_candidate2_acquisition_lane.py
            fi
            python scripts/controllergate_audit.py --protocol current
            python scripts/controllergate_run.py --protocol current --dry-run
          fi

      - name: Validate frontier interface when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/controllergate_frontier.py && -f outputs/frontier/CURRENT_FRONTIER_STATE.json ]]; then
            python scripts/controllergate_frontier.py status
            python scripts/controllergate_frontier.py validate
          fi

      - name: Verify repository diff formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: Stage clean artifact payload and write manifest
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${{ inputs.artifact_output_directory }}"
          if [[ -z "$output_dir" ]]; then output_dir="${{ inputs.lane_id }}"; fi
          python scripts/stage_controllergate_artifact.py \
            --destination "$RUNNER_TEMP/controllergate_artifact" \
            --source "outputs/$output_dir" \
            --source "outputs/current" \
            --source "outputs/frontier" \
            --source "docs/CURRENT_FRONTIER_STATUS.md" \
            --source "docs/EVIDENCE_RETENTION_AND_MIGRATION.md" \
            --source "configs/controllergate_current.yaml" \
            --source "configs/controllergate_frontier.yaml" \
            --source "configs/controllergate_v2_14.yaml" \
            --source "configs/controllergate_v2_15.yaml" \
            --source "configs/controllergate_prospective_memory_validation_v1.json" \
            --source "configs/controllergate_evidence_retention_policy.json" \
            --source "configs/controllergate_regression_audit_registry.json"

      - name: Upload lane artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/controllergate_artifact/**
          if-no-files-found: error
