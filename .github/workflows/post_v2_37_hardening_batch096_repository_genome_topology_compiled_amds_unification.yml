name: post_v2_37_hardening_batch096_repository_genome_topology_compiled_amds_unification

on:
  workflow_dispatch:
    inputs:
      run_historical_actuation:
        description: Protected continuation; Batch096 ordinary workflow must remain false
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce ordinary evidence-only boundary
        shell: bash
        run: |
          test '${{ inputs.run_historical_actuation }}' = 'false'
      - name: Install ControllerGate test dependencies
        run: python -m pip install . pytest
      - name: Canonical foundation tests
        run: python -m pytest tests/core/test_batch096_canonical_foundations.py tests/core/test_batch096_materialization_topology.py tests/core/test_batch096_amds_release.py -q
      - name: Rebuild compact materialization and topology evidence
        run: python scripts/run_batch096_materialization_and_topology.py
      - name: Rebuild topology-compiled AMDS and public evidence
        run: python scripts/run_batch096_amds_and_release.py
      - name: Batch096 audit
        run: python scripts/audit_batch096_repository_genome_topology_compiled_amds.py
      - name: Current protocol audit
        run: python scripts/controllergate_audit.py --protocol current
      - name: Current protocol dry-run
        run: python scripts/controllergate_run.py --protocol current --dry-run
      - name: Byte custody preflight
        run: python scripts/byte_custody_preflight.py
      - name: Stage compact artifact and manifests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/staged"
          mkdir -p "$RUNNER_TEMP/staged/outputs"
          cp -a outputs/post_v2_37_hardening_batch096_repository_genome_topology_compiled_amds_unification "$RUNNER_TEMP/staged/outputs/"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path(__import__('os').environ['RUNNER_TEMP'])/'staged'
          bad=[p for p in root.rglob('*') if p.is_file() and (p.suffix in {'.pyc','.zip','.whl','.sqlite','.db'} or '__pycache__' in p.parts)]
          if bad: raise SystemExit(f'forbidden staged payload: {bad}')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          (root/'ARTIFACT_SHA256SUMS.txt').write_text('\n'.join(rows)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch096_repository_genome_topology_compiled_amds_unification_artifacts
          path: ${{ runner.temp }}/staged
          retention-days: 1
          if-no-files-found: error
