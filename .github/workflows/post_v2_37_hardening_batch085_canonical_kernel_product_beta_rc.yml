name: post_v2_37_hardening_batch085_canonical_kernel_product_beta_rc

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  RESULT: post_v2_37_hardening_batch085_canonical_kernel_product_beta_rc

jobs:
  architecture-and-state:
    name: Canonical architecture, durable state, typed tokens, proof, and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Canonical convergence audits
        run: |
          python scripts/audit_canonical_component_uniqueness.py
          python scripts/audit_no_batch_core_logic.py
          python scripts/audit_no_legacy_production_imports.py
          python scripts/audit_external_operation_boundaries.py
          python scripts/audit_duplicate_core_implementations.py
          python scripts/audit_no_hardcoded_production_counts.py
      - name: Durable state and canonical boundary tests
        run: python -m pytest tests/state/test_batch085_controller_state.py tests/reactions/test_batch085_typed_kernel.py tests/proof/test_batch085_proof_count.py tests/core/test_batch085_canonical_convergence.py tests/core/test_batch085_cli_semantics.py -q

  linux-package-installation:
    name: Linux Python 3.11 package and installed-runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install build wheel setuptools
      - name: Build, install, and exercise installed package
        run: python scripts/batch085_ci_stage.py package --out "$GITHUB_WORKSPACE/.batch085-cache/linux" --runtime "$RUNNER_TEMP/controllergate-runtime" --platform linux
      - uses: actions/cache/save@v4
        with:
          path: .batch085-cache/linux
          key: batch085-linux-package-${{ github.run_id }}
          enableCrossOsArchive: true

  windows-package-installation:
    name: Windows Python 3.13 package and installed-runtime checks
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install build wheel setuptools
      - name: Build, install, and exercise installed package
        shell: pwsh
        run: python scripts/batch085_ci_stage.py package --out "$env:GITHUB_WORKSPACE\.batch085-cache\windows" --runtime "$env:RUNNER_TEMP\controllergate-runtime" --platform windows
      - uses: actions/cache/save@v4
        with:
          path: .batch085-cache/windows
          key: batch085-windows-package-${{ github.run_id }}
          enableCrossOsArchive: true

  final-audit-and-package:
    name: Product Beta RC adjudication, regressions, critic, and clean artifact
    needs: [architecture-and-state, linux-package-installation, windows-package-installation]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest build wheel setuptools
      - uses: actions/cache/restore@v4
        with:
          path: .batch085-cache/linux
          key: batch085-linux-package-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: .batch085-cache/windows
          key: batch085-windows-package-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Assemble platform reports and execute canonical Product Beta evidence
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$GITHUB_WORKSPACE/.batch085-cache/linux/batch085_package_linux.json" "$RUNNER_TEMP/evidence/"
          cp "$GITHUB_WORKSPACE/.batch085-cache/windows/batch085_package_windows.json" "$RUNNER_TEMP/evidence/"
          cp outputs/$RESULT/batch084_*.json "$RUNNER_TEMP/evidence/"
          python scripts/batch085_ci_stage.py execute --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime/execution"
          python scripts/batch085_ci_stage.py finalize --out "$RUNNER_TEMP/evidence" --runtime "$RUNNER_TEMP/controllergate-runtime"
      - name: Focused Batch085 product tests
        run: python -m pytest tests/state/test_batch085_controller_state.py tests/reactions/test_batch085_typed_kernel.py tests/proof/test_batch085_proof_count.py tests/core/test_batch085_canonical_convergence.py tests/core/test_batch085_cli_semantics.py tests/watch/test_batch085_watch_loop.py tests/product/test_batch085_product_runtime.py tests/runtime/test_batch085_boundary_regressions.py -q
      - name: Complete registered core and runtime suites
        run: python -m pytest tests/core tests/runtime tests/state tests/reactions tests/proof tests/product tests/watch tests/connectors -q
      - name: Batch073 through Batch084 preservation audits
        run: |
          python scripts/audit_batch073_count5_revalidation_frozen_wave1.py
          python scripts/audit_batch074_sterile_high_yield_amds_memory_wave1.py
          python scripts/audit_batch075_provider_harness_amds_memory_wave1a.py
          python scripts/audit_batch076_amds_causal_memory_calibration.py
          python scripts/audit_batch077_typed_event_pathway_memory_v2.py
          python scripts/audit_batch078_count6_minimal_closure_memory_wave1b.py
          python scripts/audit_batch079_count6_runtime_incident_memory_wave1c.py
          python scripts/audit_batch080_executed_preflight_provider_memory_wave1d.py
          python scripts/audit_batch081_execution_constitution_provider_incident_pilot.py
          python scripts/audit_batch082_ci_native_maintenance_order_provider_wave1f.py --output outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
          python scripts/audit_batch083_reaction_product_cross_area_wave1g.py --out outputs/post_v2_37_hardening_batch083_reaction_product_cross_area_wave1g
          python scripts/audit_batch084_real_amds_canary_product_beta.py --out outputs/post_v2_37_hardening_batch084_real_amds_canary_product_beta
      - name: Protocol, public-state, architecture, and independent Batch085 audits
        run: |
          python scripts/audit_v2_18_evidence_derived_topology_historical_provider.py
          python scripts/audit_v2_19_authorized_amds_active_maintenance.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          python scripts/audit_public_language.py
          python scripts/audit_current_state_view_sync.py
          python scripts/audit_canonical_component_uniqueness.py
          python scripts/audit_no_batch_core_logic.py
          python scripts/audit_no_legacy_production_imports.py
          python scripts/audit_external_operation_boundaries.py
          python scripts/audit_duplicate_core_implementations.py
          python scripts/audit_no_hardcoded_production_counts.py
          python scripts/audit_batch085_canonical_kernel_product_beta_rc.py --out "$RUNNER_TEMP/evidence"
      - name: Package single clean main artifact
        run: |
          STAGE="$RUNNER_TEMP/artifact-stage"
          mkdir -p "$STAGE/outputs/$RESULT" "$STAGE/configs" "$STAGE/docs"
          cp -a "$RUNNER_TEMP/evidence/." "$STAGE/outputs/$RESULT/"
          cp configs/batch085_prompt_contract.json configs/controllergate_canonical_component_registry.json configs/controllergate_legacy_component_registry.jsonl configs/canonical_count_migration.json "$STAGE/configs/"
          cp docs/ADR-0085-CANONICAL-MAINTENANCE-KERNEL.md "$STAGE/docs/" 2>/dev/null || true
          cp docs/architecture/ADR-0085-CANONICAL-MAINTENANCE-KERNEL.md docs/PRODUCT_BETA_OPERATOR_GUIDE.md docs/RELEASE_CANDIDATE_STATUS.md "$STAGE/docs/"
          if find "$STAGE" -type f \( -name '*.pyc' -o -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' -o -name '*.whl' \) | grep -q .; then exit 1; fi
          if find "$STAGE" -type d -name '__pycache__' | grep -q .; then exit 1; fi
          (cd "$STAGE" && find . -type f ! -name ARTIFACT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > ARTIFACT_SHA256SUMS.txt)
          test -s "$STAGE/ARTIFACT_SHA256SUMS.txt"
      - name: Publish official summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          decision=json.load(open(out/'batch085_product_beta_rc_decision.json'))
          claims=json.load(open(out/'batch085_claim_boundary.json'))
          print('# Batch085 official result')
          print('- Audit: PASS')
          print(f"- Product Beta RC: {decision['status']}")
          print(f"- Package validation: {decision['package_validation']}")
          print(f"- Issue-derived repairs: {claims['issue_derived_repair_count']}")
          print(f"- Native external repairs: {claims['native_external_repair_count']}")
          print(f"- Exact blockers: {', '.join(decision['exact_blockers'])}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch085_canonical_kernel_product_beta_rc_artifacts
          path: ${{ runner.temp }}/artifact-stage
          if-no-files-found: error
          retention-days: 30
