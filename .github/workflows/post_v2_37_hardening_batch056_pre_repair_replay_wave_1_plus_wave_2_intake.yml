name: post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch056-pre-repair-replay-wave-1-plus-wave-2-intake:
    name: Batch056 pre-repair replay wave 1 plus wave 2 intake validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout ControllerGate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run byte-custody preflight before validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Install workflow test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run shared core and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/core tests/runtime -q

      - name: Validate registry, prior audits, Batch056 audit, and current protocol
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_external_candidate_registry.py
          python scripts/audit_batch055_seed_discovery_wave_1.py
          python scripts/audit_post_v2_37_hardening_and_batch002.py
          python scripts/audit_batch056_pre_repair_replay_wave_1_plus_wave_2_intake.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          git diff --check
          python - <<'PY'
          import json
          state = json.load(open("outputs/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake/twenty_seed_campaign_dashboard_v2.json", encoding="utf-8"))
          recommendation = json.load(open("outputs/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake/batch057_patch_gate_recommendation.json", encoding="utf-8"))
          blockers = json.load(open("outputs/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake/wave_1_exact_blockers.json", encoding="utf-8"))
          for key in [
              "status",
              "batch055_ingest_status",
              "wave_1_candidate_count",
              "wave_1_materialized_failure_count",
              "wave_1_blocked_count",
              "wave_2_leads_screened",
              "wave_2_codex_augmented_leads",
              "wave_2_commit_resolved_candidate_count",
              "wave_2_approved_for_future_replay_count",
              "issue_derived_repair_count",
              "native_external_repair_count",
              "next_allowed_action",
              "full_scoring",
              "memory_lift",
              "self_maintaining_software",
          ]:
              print(f"batch056_{key}={state.get(key)}")
          print(f"batch056_batch057_patch_gate_recommendation_count={recommendation.get('recommendation_count')}")
          print(f"batch056_wave_1_exact_blockers={json.dumps(blockers.get('blockers', {}), sort_keys=True)}")
          PY

      - name: Stage clean Batch056 artifact payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact_payload/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake
          mkdir -p artifact_payload/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake
          cp -a outputs/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake artifact_payload/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake/
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("artifact_payload/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake")
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "ARTIFACT_SHA256SUMS.txt":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  rows.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "ARTIFACT_SHA256SUMS.txt").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          test -f artifact_payload/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake/ARTIFACT_SHA256SUMS.txt
          if find artifact_payload/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake \( \
            -path '*/__pycache__/*' -o \
            -path '*/.pytest_cache/*' -o \
            -path '*/.mypy_cache/*' -o \
            -path '*/.ruff_cache/*' -o \
            -path '*/.venv/*' -o \
            -path '*/venv/*' -o \
            -path '*/env/*' -o \
            -path '*/ENV/*' -o \
            -name '*.pyc' -o \
            -name '*.pyo' -o \
            -name '*.zip' -o \
            -name '*.tar' -o \
            -name '*.tar.gz' -o \
            -name '*.tgz' -o \
            -name '*.7z' -o \
            -name '*.whl' \
          \) -print -quit | grep -q .; then
            echo "artifact_packaging_forbidden_payload_detected"
            exit 1
          fi

      - name: Upload Batch056 pre-repair replay wave 1 plus wave 2 intake artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake_artifacts
          path: |
            artifact_payload/post_v2_37_hardening_batch056_pre_repair_replay_wave_1_plus_wave_2_intake/**
          if-no-files-found: error
