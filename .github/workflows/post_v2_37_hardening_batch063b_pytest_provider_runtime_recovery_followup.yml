name: post_v2_37_hardening_batch063b_pytest_provider_runtime_recovery_followup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch063b-pytest-provider-runtime-recovery-followup:
    name: Batch063b Pytest provider/runtime recovery follow-up validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      OUT_NAME: post_v2_37_hardening_batch063b_pytest_provider_runtime_recovery_followup

    steps:
      - name: Checkout ControllerGate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run byte-custody preflight before validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Install workflow test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run shared core and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/core tests/runtime -q

      - name: Validate registry, Batch063b audit, prior audits, and current protocol
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_external_candidate_registry.py
          python scripts/audit_batch063b_pytest_provider_runtime_recovery_followup.py
          git diff --check
          python - <<'PY'
          import json
          root = "outputs/post_v2_37_hardening_batch063b_pytest_provider_runtime_recovery_followup"
          final = json.load(open(f"{root}/batch063b_final_decision.json", encoding="utf-8"))
          for key in [
              "status",
              "batch066_ingest_status",
              "batch063b_audit_status",
              "current_protocol",
              "issue_derived_repair_count",
              "native_external_repair_count",
              "pytest_version_origin_classification",
              "pytest_runner_target_import_origin_classification",
              "pytest_command_boundary_classification",
              "pytest_provider_runtime_setup_status",
              "pytest_prerepair_replay_classification",
              "pytest_future_patch_license_state",
              "repo_hygiene_pressure_status",
              "recommended_next_proof_path",
              "recommended_next_wrapper_hardening_path",
              "historical_requirement_recovery_status",
              "recovered_requirement_count",
              "historical_requirements_implemented_now_count",
              "historical_requirements_scaffolded_with_audit_count",
              "historical_requirements_blocked_with_exact_reason_count",
              "historical_requirements_assigned_to_named_future_batches_count",
              "project_health_grade",
              "traffic_light_status",
              "distance_to_issue_derived_repair_count_5",
              "distance_to_self_maintaining_claim",
              "next_allowed_action",
              "full_scoring",
              "memory_lift",
              "self_maintaining_software",
              "exact_blocker",
          ]:
              print(f"{key}={final.get(key)}")
          PY

      - name: Stage clean Batch063b artifact payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "artifact_payload/${OUT_NAME}"
          mkdir -p "artifact_payload/${OUT_NAME}"
          cp -a "outputs/${OUT_NAME}/." "artifact_payload/${OUT_NAME}/"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path("artifact_payload") / os.environ["OUT_NAME"]
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "ARTIFACT_SHA256SUMS.txt":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  rows.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "ARTIFACT_SHA256SUMS.txt").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          test -f "artifact_payload/${OUT_NAME}/ARTIFACT_SHA256SUMS.txt"
          if find "artifact_payload/${OUT_NAME}" \( \
            -path '*/__pycache__/*' -o \
            -path '*/.pytest_cache/*' -o \
            -path '*/.mypy_cache/*' -o \
            -path '*/.ruff_cache/*' -o \
            -path '*/.venv/*' -o \
            -path '*/venv/*' -o \
            -path '*/env/*' -o \
            -path '*/ENV/*' -o \
            -name '*.pyc' -o \
            -name '*.pyo' -o \
            -name '*.zip' -o \
            -name '*.tar' -o \
            -name '*.tar.gz' -o \
            -name '*.tgz' -o \
            -name '*.7z' -o \
            -name '*.whl' \
          \) -print -quit | grep -q .; then
            echo "artifact_packaging_forbidden_payload_detected"
            exit 1
          fi

      - name: Upload Batch063b Pytest provider/runtime recovery follow-up artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch063b_pytest_provider_runtime_recovery_followup_artifacts
          path: |
            artifact_payload/post_v2_37_hardening_batch063b_pytest_provider_runtime_recovery_followup/**
          if-no-files-found: error
