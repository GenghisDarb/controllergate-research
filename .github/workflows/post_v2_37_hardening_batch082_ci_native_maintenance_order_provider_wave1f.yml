name: post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  prepare-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest pyyaml
      - name: Require no precommitted Batch082 result
        run: test ! -e outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
      - run: python scripts/audit_engineering_constitution_v2.py
      - run: python -m pytest tests/governance/test_engineering_constitution_v2.py tests/runtime/test_batch082_ci_native_guard.py tests/core/test_batch082_maintenance_graph_v2.py -q
      - run: python scripts/batch082_ci_stage.py prepare --runtime-root "$RUNNER_TEMP/controllergate-runtime" --output outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
      - uses: actions/upload-artifact@v4
        with: {name: batch082-prepared-evidence, path: outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f, if-no-files-found: error}

  openbb-provider-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/batch082_ci_stage.py provider --candidate openbb --runtime-root "$RUNNER_TEMP/controllergate-runtime" --output "$RUNNER_TEMP/openbb-provider-evidence" --payload "$RUNNER_TEMP/openbb-provider" --input-payload "$RUNNER_TEMP/openbb-input"
      - uses: actions/upload-artifact@v4
        with: {name: batch082_openbb_v5_linux_py311_provider, path: "${{ runner.temp }}/openbb-provider", if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: batch082_openbb_eodhd_openapi_input_snapshot, path: "${{ runner.temp }}/openbb-input", if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: batch082-openbb-provider-evidence, path: "${{ runner.temp }}/openbb-provider-evidence", if-no-files-found: error}

  poetry-provider-acquisition:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - shell: pwsh
        run: python scripts/batch082_ci_stage.py provider --candidate poetry --runtime-root "$env:RUNNER_TEMP\controllergate-runtime" --output "$env:RUNNER_TEMP\poetry-provider-evidence" --payload "$env:RUNNER_TEMP\poetry-provider"
      - uses: actions/upload-artifact@v4
        with: {name: batch082_poetry_241_windows_py313_provider, path: "${{ runner.temp }}/poetry-provider", if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: batch082-poetry-provider-evidence, path: "${{ runner.temp }}/poetry-provider-evidence", if-no-files-found: error}

  openbb-duplicate-diagnosis:
    needs: openbb-provider-acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with: {name: batch082_openbb_v5_linux_py311_provider, path: "${{ runner.temp }}/openbb-provider"}
      - uses: actions/download-artifact@v4
        with: {name: batch082_openbb_eodhd_openapi_input_snapshot, path: "${{ runner.temp }}/openbb-input"}
      - run: python scripts/batch082_ci_stage.py reproduce --candidate openbb --runtime-root "$RUNNER_TEMP/controllergate-runtime" --payload "$RUNNER_TEMP/openbb-provider" --input-payload "$RUNNER_TEMP/openbb-input" --output "$RUNNER_TEMP/openbb-diagnosis"
      - uses: actions/upload-artifact@v4
        with: {name: batch082-openbb-diagnosis-evidence, path: "${{ runner.temp }}/openbb-diagnosis", if-no-files-found: error}

  poetry-duplicate-diagnosis:
    needs: poetry-provider-acquisition
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/download-artifact@v4
        with: {name: batch082_poetry_241_windows_py313_provider, path: "${{ runner.temp }}/poetry-provider"}
      - shell: pwsh
        run: python scripts/batch082_ci_stage.py reproduce --candidate poetry --runtime-root "$env:RUNNER_TEMP\controllergate-runtime" --payload "$env:RUNNER_TEMP\poetry-provider" --output "$env:RUNNER_TEMP\poetry-diagnosis"
      - uses: actions/upload-artifact@v4
        with: {name: batch082-poetry-diagnosis-evidence, path: "${{ runner.temp }}/poetry-diagnosis", if-no-files-found: error}

  cohort-adjudication:
    needs: [prepare-and-freeze, openbb-duplicate-diagnosis, poetry-duplicate-diagnosis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: batch082-openbb-provider-evidence, path: "${{ runner.temp }}/evidence/openbb-provider"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-poetry-provider-evidence, path: "${{ runner.temp }}/evidence/poetry-provider"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-openbb-diagnosis-evidence, path: "${{ runner.temp }}/evidence/openbb-diagnosis"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-poetry-diagnosis-evidence, path: "${{ runner.temp }}/evidence/poetry-diagnosis"}
      - run: python scripts/batch082_ci_stage.py cohort --evidence-root "$RUNNER_TEMP/evidence" --output "$RUNNER_TEMP/cohort"
      - uses: actions/upload-artifact@v4
        with: {name: batch082-cohort-evidence, path: "${{ runner.temp }}/cohort", if-no-files-found: error}

  comparative-or-single-pilot:
    needs: cohort-adjudication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: batch082-cohort-evidence, path: "${{ runner.temp }}/cohort"}
      - run: python scripts/batch082_ci_stage.py pilot --cohort-dir "$RUNNER_TEMP/cohort" --output "$RUNNER_TEMP/pilot"
      - uses: actions/upload-artifact@v4
        with: {name: batch082-pilot-evidence, path: "${{ runner.temp }}/pilot", if-no-files-found: error}

  blinded-ground-truth:
    needs: comparative-or-single-pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: batch082-cohort-evidence, path: "${{ runner.temp }}/cohort"}
      - run: python scripts/batch082_ci_stage.py ground-truth --cohort-dir "$RUNNER_TEMP/cohort" --output "$RUNNER_TEMP/ground-truth"
      - uses: actions/upload-artifact@v4
        with: {name: batch082-ground-truth-evidence, path: "${{ runner.temp }}/ground-truth", if-no-files-found: error}

  conditional-repair-authorization:
    needs: blinded-ground-truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: batch082-cohort-evidence, path: "${{ runner.temp }}/cohort"}
      - run: python scripts/batch082_ci_stage.py authorization --cohort-dir "$RUNNER_TEMP/cohort" --output "$RUNNER_TEMP/authorization"
      - uses: actions/upload-artifact@v4
        with: {name: batch082-authorization-evidence, path: "${{ runner.temp }}/authorization", if-no-files-found: error}

  conditional-platform-repair:
    needs: conditional-repair-authorization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: batch082-cohort-evidence, path: "${{ runner.temp }}/cohort"}
      - run: python scripts/batch082_ci_stage.py repair --cohort-dir "$RUNNER_TEMP/cohort" --output "$RUNNER_TEMP/repair"
      - uses: actions/upload-artifact@v4
        with: {name: batch082-repair-evidence, path: "${{ runner.temp }}/repair", if-no-files-found: error}

  final-independent-critic:
    needs: conditional-platform-repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: batch082-cohort-evidence, path: "${{ runner.temp }}/cohort"}
      - run: python scripts/batch082_ci_stage.py critic --cohort-dir "$RUNNER_TEMP/cohort" --output "$RUNNER_TEMP/critic"
      - uses: actions/upload-artifact@v4
        with: {name: batch082-critic-evidence, path: "${{ runner.temp }}/critic", if-no-files-found: error}

  final-audit-and-package:
    needs: [final-independent-critic, openbb-provider-acquisition, poetry-provider-acquisition, openbb-duplicate-diagnosis, poetry-duplicate-diagnosis, comparative-or-single-pilot, blinded-ground-truth, conditional-repair-authorization]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest pyyaml
      - name: Require no precommitted Batch082 result
        run: test ! -e outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
      - uses: actions/download-artifact@v4
        with: {name: batch082-prepared-evidence, path: "${{ runner.temp }}/prepared"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-openbb-provider-evidence, path: "${{ runner.temp }}/evidence/openbb-provider"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-poetry-provider-evidence, path: "${{ runner.temp }}/evidence/poetry-provider"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-openbb-diagnosis-evidence, path: "${{ runner.temp }}/evidence/openbb-diagnosis"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-poetry-diagnosis-evidence, path: "${{ runner.temp }}/evidence/poetry-diagnosis"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-cohort-evidence, path: "${{ runner.temp }}/evidence/cohort"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-pilot-evidence, path: "${{ runner.temp }}/evidence/pilot"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-ground-truth-evidence, path: "${{ runner.temp }}/evidence/ground-truth"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-authorization-evidence, path: "${{ runner.temp }}/evidence/authorization"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-repair-evidence, path: "${{ runner.temp }}/evidence/repair"}
      - uses: actions/download-artifact@v4
        with: {name: batch082-critic-evidence, path: "${{ runner.temp }}/evidence/critic"}
      - run: python scripts/batch082_ci_stage.py finalize --prepared "$RUNNER_TEMP/prepared" --evidence-root "$RUNNER_TEMP/evidence" --output outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
      - run: python scripts/audit_batch082_ci_native_maintenance_order_provider_wave1f.py --output outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
      - run: python scripts/audit_engineering_constitution_v2.py --proofs outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f/batch082_constitution_v2_law_proofs.jsonl
      - run: python -m pytest tests/core tests/runtime tests/governance -q
      - run: |
          python scripts/audit_batch081_execution_constitution_provider_incident_pilot.py
          python scripts/audit_batch080_executed_preflight_provider_memory_wave1d.py
          python scripts/audit_batch079_count6_runtime_incident_memory_wave1c.py
          python scripts/audit_batch078_count6_minimal_closure_memory_wave1b.py
          python scripts/audit_batch077_typed_event_pathway_memory_v2.py
          python scripts/audit_batch076_amds_causal_memory_calibration.py
          python scripts/audit_batch075_provider_harness_amds_memory_wave1a.py
          python scripts/audit_batch074_sterile_high_yield_amds_memory_wave1.py
          python scripts/audit_batch073_count5_revalidation_frozen_wave1.py
          python scripts/audit_v2_18_evidence_derived_topology_historical_provider.py
          python scripts/audit_v2_19_authorized_amds_active_maintenance.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          python scripts/controllergate_frontier.py validate
          python scripts/audit_public_language.py
          python scripts/audit_public_frontier_sync.py
          python scripts/run_local_controllergate_demo.py
      - name: Reject provider bytes and compiled/cache payloads from main artifact
        run: |
          if find outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f -type f \( -name '*.whl' -o -name '*.zip' -o -name '*.tar' -o -name '*.pyc' -o -name '*.pyo' \) | grep -q .; then exit 1; fi
          if find outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f -type d \( -name '__pycache__' -o -name '.venv' \) | grep -q .; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f_artifacts
          path: outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
          if-no-files-found: error
          retention-days: 30
