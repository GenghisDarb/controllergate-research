name: post_v2_37_hardening_batch063_wave3_or_salvage_pre_repair_replay_limited

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch063-wave3-salvage-pre-repair-replay-limited:
    name: Batch063 wave3 or salvage pre-repair replay limited validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      OUT_NAME: post_v2_37_hardening_batch063_wave3_or_salvage_pre_repair_replay_limited

    steps:
      - name: Checkout ControllerGate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run byte-custody preflight before validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Install workflow test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run shared core and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/core tests/runtime -q

      - name: Validate registry, Batch063 audit, prior audits, and current protocol
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_external_candidate_registry.py
          python scripts/audit_batch063_wave3_or_salvage_pre_repair_replay_limited.py
          git diff --check
          python - <<'PY'
          import json
          root = "outputs/post_v2_37_hardening_batch063_wave3_or_salvage_pre_repair_replay_limited"
          final = json.load(open(f"{root}/batch063_final_decision.json", encoding="utf-8"))
          print(f"batch063_status={final.get('status')}")
          print(f"batch058c_ingest_status={final.get('batch058c_ingest_status')}")
          print(f"current_protocol={final.get('current_protocol')}")
          print(f"issue_derived_repair_count={final.get('issue_derived_repair_count')}")
          print(f"native_external_repair_count={final.get('native_external_repair_count')}")
          print(f"pytest_pre_repair_replay_classification={final.get('pytest_pre_repair_replay_classification')}")
          print(f"freezegun_pre_repair_replay_classification={final.get('freezegun_pre_repair_replay_classification')}")
          print(f"materialized_failure_count={final.get('materialized_failure_count')}")
          print(f"provider_runtime_blocked_count={final.get('provider_runtime_blocked_count')}")
          print(f"failure_not_reproduced_count={final.get('failure_not_reproduced_count')}")
          print(f"future_patch_gate_candidates={final.get('future_patch_gate_candidates')}")
          print(f"future_decomposition_candidates={final.get('future_decomposition_candidates')}")
          print(f"project_health_grade={final.get('project_health_grade')}")
          print(f"traffic_light_status={final.get('traffic_light_status')}")
          print(f"distance_to_issue_derived_repair_count_4={final.get('distance_to_issue_derived_repair_count_4')}")
          print(f"distance_to_self_maintaining_claim={final.get('distance_to_self_maintaining_claim')}")
          print(f"next_allowed_action={final.get('next_allowed_action')}")
          print(f"full_scoring={final.get('full_scoring')}")
          print(f"memory_lift={final.get('memory_lift')}")
          print(f"self_maintaining_software={final.get('self_maintaining_software')}")
          print(f"exact_blocker={final.get('exact_blocker')}")
          PY

      - name: Stage clean Batch063 artifact payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "artifact_payload/${OUT_NAME}"
          mkdir -p "artifact_payload/${OUT_NAME}"
          cp -a "outputs/${OUT_NAME}/." "artifact_payload/${OUT_NAME}/"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path("artifact_payload") / os.environ["OUT_NAME"]
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "ARTIFACT_SHA256SUMS.txt":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  rows.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "ARTIFACT_SHA256SUMS.txt").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          test -f "artifact_payload/${OUT_NAME}/ARTIFACT_SHA256SUMS.txt"
          if find "artifact_payload/${OUT_NAME}" \( \
            -path '*/__pycache__/*' -o \
            -path '*/.pytest_cache/*' -o \
            -path '*/.mypy_cache/*' -o \
            -path '*/.ruff_cache/*' -o \
            -path '*/.venv/*' -o \
            -path '*/venv/*' -o \
            -path '*/env/*' -o \
            -path '*/ENV/*' -o \
            -name '*.pyc' -o \
            -name '*.pyo' -o \
            -name '*.zip' -o \
            -name '*.tar' -o \
            -name '*.tar.gz' -o \
            -name '*.tgz' -o \
            -name '*.7z' -o \
            -name '*.whl' \
          \) -print -quit | grep -q .; then
            echo "artifact_packaging_forbidden_payload_detected"
            exit 1
          fi

      - name: Upload Batch063 wave3 or salvage pre-repair replay limited artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch063_wave3_or_salvage_pre_repair_replay_limited_artifacts
          path: |
            artifact_payload/post_v2_37_hardening_batch063_wave3_or_salvage_pre_repair_replay_limited/**
          if-no-files-found: error
