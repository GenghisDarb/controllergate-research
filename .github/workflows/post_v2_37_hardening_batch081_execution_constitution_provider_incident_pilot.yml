name: post_v2_37_hardening_batch081_execution_constitution_provider_incident_pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch081:
    name: Batch081 execution constitution and incident pilot
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ControllerGate test dependencies
        run: python -m pip install pytest pyyaml

      - name: Verify workflow head and checkpoint ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "581da09e08ee6aa01e53b0931c784a0b9509bd91" HEAD

      - name: Attest authoritative runtime root
        run: python scripts/preflight_controllergate_runtime_root.py --runtime-root "$RUNNER_TEMP/controllergate-runtime"

      - name: Run engineering constitution and canonical boundary audits
        run: |
          python scripts/audit_engineering_constitution.py
          python scripts/audit_canonical_boundary_usage.py
          python scripts/audit_runtime_root_policy.py

      - name: Run focused Batch081 tests
        run: python -m pytest tests/governance tests/runtime/test_runtime_root_policy.py tests/runtime/test_execution_authenticity.py tests/runtime/test_collection_contract_v2.py tests/runtime/test_provider_builder_v3.py tests/core/test_contamination_classifier_v2.py tests/core/test_target_resolver_v3.py -q

      - name: Run complete core runtime and governance suite
        run: python -m pytest tests/core tests/runtime tests/governance -q

      - name: Run preservation and protocol audits
        run: |
          python scripts/audit_batch080_executed_preflight_provider_memory_wave1d.py
          python scripts/audit_batch079_count6_runtime_incident_memory_wave1c.py
          python scripts/audit_batch078_count6_minimal_closure_memory_wave1b.py
          python scripts/audit_batch077_typed_event_pathway_memory_v2.py
          python scripts/audit_batch076_amds_causal_memory_calibration.py
          python scripts/audit_batch075_provider_harness_amds_memory_wave1a.py
          python scripts/audit_batch074_sterile_high_yield_amds_memory_wave1.py
          python scripts/audit_batch073_count5_revalidation_frozen_wave1.py
          python scripts/audit_v2_18_origin_licensing_source_acquisition.py
          python scripts/audit_v2_19_authorized_amds_active_maintenance.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          python scripts/controllergate_frontier.py validate

      - name: Run Batch081 independent audits
        run: |
          python scripts/audit_public_frontier_sync.py
          python scripts/audit_public_language.py
          python scripts/run_local_controllergate_demo.py

      - name: Record workflow execution identity and finalize critic evidence
        shell: bash
        run: |
          echo "CHECKED_OUT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          export CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          export CONTROLLERGATE_RUNTIME_ROOT="$RUNNER_TEMP/controllergate-runtime"
          python scripts/finalize_batch081_workflow_evidence.py

      - name: Run finalized Batch081 and builder-critic audits
        run: |
          python scripts/audit_batch081_execution_constitution_provider_incident_pilot.py
          python scripts/audit_builder_critic_agreement.py

      - name: Stage clean evidence payload
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/batch081-artifact"
          mkdir -p "$RUNNER_TEMP/batch081-artifact"
          cp -R outputs/post_v2_37_hardening_batch073_count5_revalidation_frozen_wave1 "$RUNNER_TEMP/batch081-artifact/"
          cp -R outputs/post_v2_37_hardening_batch074_sterile_high_yield_amds_memory_wave1 "$RUNNER_TEMP/batch081-artifact/"
          cp -R outputs/post_v2_37_hardening_batch075_provider_harness_amds_memory_wave1a "$RUNNER_TEMP/batch081-artifact/"
          cp -R outputs/post_v2_37_hardening_batch076_amds_causal_memory_calibration "$RUNNER_TEMP/batch081-artifact/"
          cp -R outputs/post_v2_37_hardening_batch077_typed_event_pathway_memory_v2 "$RUNNER_TEMP/batch081-artifact/"
          cp -R outputs/post_v2_37_hardening_batch078_count6_minimal_closure_memory_wave1b "$RUNNER_TEMP/batch081-artifact/"
          cp -R outputs/post_v2_37_hardening_batch079_count6_runtime_incident_memory_wave1c "$RUNNER_TEMP/batch081-artifact/"
          cp -R outputs/post_v2_37_hardening_batch080_executed_preflight_provider_memory_wave1d "$RUNNER_TEMP/batch081-artifact/"
          cp -R outputs/post_v2_37_hardening_batch081_execution_constitution_provider_incident_pilot "$RUNNER_TEMP/batch081-artifact/"
          cp configs/controllergate_engineering_constitution_v1.json "$RUNNER_TEMP/batch081-artifact/"
          cp configs/historical_requirement_registry_v1.jsonl "$RUNNER_TEMP/batch081-artifact/"
          if find "$RUNNER_TEMP/batch081-artifact" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.whl' -o -name '*.zip' -o -name '*.tar' -o -name '*.tgz' \) | grep -q .; then exit 1; fi
          if find "$RUNNER_TEMP/batch081-artifact" -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name '.venv' \) | grep -q .; then exit 1; fi
          (cd "$RUNNER_TEMP/batch081-artifact" && find . -type f ! -name ARTIFACT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > ARTIFACT_SHA256SUMS.txt)

      - name: Upload Batch081 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch081_execution_constitution_provider_incident_pilot_artifacts
          path: ${{ runner.temp }}/batch081-artifact
          if-no-files-found: error
          retention-days: 30
