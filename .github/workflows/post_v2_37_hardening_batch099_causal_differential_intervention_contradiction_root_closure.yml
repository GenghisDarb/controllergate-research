name: post_v2_37_hardening_batch099_causal_differential_intervention_contradiction_root_closure

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  batch098_official_ingest_custody:
    runs-on: ubuntu-latest
    outputs:
      ingest_receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify committed official ingest
        run: |
          python scripts/verify_batch098_official_semantic_closure_ingest.py \
            --output-root outputs/post_v2_37_hardening_batch099_causal_differential_intervention_contradiction_root_closure_master_completion_ledger
          python scripts/audit_batch098_artifact_repository_reconciliation.py \
            --output-root outputs/post_v2_37_hardening_batch099_causal_differential_intervention_contradiction_root_closure_master_completion_ledger
      - name: Download original corrected artifact for byte comparison
        uses: actions/download-artifact@v4
        with:
          name: batch098_public_truth_blind_semantic_closure_v2
          run-id: 29677246896
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/controllergate-runtime/batch098-corrected
      - name: Compare every official payload byte
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          repo=pathlib.Path('outputs/post_v2_37_hardening_batch099_causal_differential_intervention_contradiction_root_closure_master_completion_ledger/batch098_official_ingest/extracted_public_artifact')
          downloaded=pathlib.Path('${{ runner.temp }}/controllergate-runtime/batch098-corrected')
          left={p.relative_to(repo).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in repo.rglob('*') if p.is_file()}
          right={p.relative_to(downloaded).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in downloaded.rglob('*') if p.is_file()}
          assert left == right
          assert len(left) == 33
          PY
      - id: receipt
        name: Export immutable ingest receipt hash
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, pathlib
          p=pathlib.Path('outputs/post_v2_37_hardening_batch099_causal_differential_intervention_contradiction_root_closure_master_completion_ledger/batch098_official_ingest/ingest_receipts/batch098_official_ingest_receipt.json')
          print('sha256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY

  causal_differential_semantic_execution:
    needs: batch098_official_ingest_custody
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ControllerGate test dependencies
        run: python -m pip install . pytest
      - name: Download immutable Batch098 decision evidence
        uses: actions/download-artifact@v4
        with:
          name: batch098_public_decision_time_evidence
          run-id: 29671958790
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/controllergate-runtime/public-decision
      - name: Verify ingest dependency and run tests
        shell: bash
        env:
          INGEST_RECEIPT: ${{ needs.batch098_official_ingest_custody.outputs.ingest_receipt_sha256 }}
        run: |
          test "$INGEST_RECEIPT" = "a7f0b785ea0c3095e179c1b1b5168f0999bd8c7df1a08441c42a2632ac53fd4c"
          python -m pytest tests/test_batch099_official_batch098_ingest.py tests/test_batch099_causal_differential_closure.py -q
      - name: Execute corrected semantic analysis only
        shell: bash
        run: |
          STAGE="$RUNNER_TEMP/controllergate-runtime/batch099-stage"
          mkdir -p "$STAGE"
          cp -R outputs/post_v2_37_hardening_batch099_causal_differential_intervention_contradiction_root_closure_master_completion_ledger/. "$STAGE/"
          python scripts/run_batch099_causal_differential_closure.py \
            --official-ingest-root "$STAGE/batch098_official_ingest" \
            --decision-artifact "$RUNNER_TEMP/controllergate-runtime/public-decision" \
            --output-root "$STAGE" \
            --workflow-run-id "${{ github.run_id }}"
          python scripts/audit_batch099_causal_differential_closure.py --output-root "$STAGE"
      - name: Enforce boundary and package compact evidence
        shell: bash
        run: |
          STAGE="$RUNNER_TEMP/controllergate-runtime/batch099-stage"
          python - <<'PY'
          import hashlib, pathlib
          root=pathlib.Path('${{ runner.temp }}/controllergate-runtime/batch099-stage')
          manifest=root/'SHA256SUMS.txt'
          rows=[]
          for path in sorted(root.rglob('*')):
              if path.is_file() and path != manifest:
                  rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}")
          manifest.write_text('\n'.join(rows)+'\n',encoding='utf-8',newline='\n')
          assert not list(root.rglob('*.pyc'))
          assert not list(root.rglob('*.zip'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch099_causal_differential_intervention_contradiction_root_closure_artifacts
          path: ${{ runner.temp }}/controllergate-runtime/batch099-stage
          retention-days: 1
          if-no-files-found: error
