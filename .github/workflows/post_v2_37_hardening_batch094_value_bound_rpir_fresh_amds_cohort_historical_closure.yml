name: post_v2_37_hardening_batch094_value_bound_rpir_fresh_amds_cohort_historical_closure

on:
  workflow_dispatch:
    inputs:
      run_historical_actuation:
        description: Historical actuation remains unauthorized in Batch094
        type: boolean
        required: false
        default: false
      cloudpickle_patch_confirmation:
        description: Reserved external confirmation; must remain empty for the authorized Batch094 evidence run
        type: string
        required: false
        default: ""
      freezegun_patch_confirmation:
        description: Reserved external confirmation; must remain empty for the authorized Batch094 evidence run
        type: string
        required: false
        default: ""
      authorization_scope_confirmation:
        description: Reserved protected authorization scope; must remain empty for the authorized Batch094 evidence run
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  OUTPUT: outputs/post_v2_37_hardening_batch094_value_bound_rpir_fresh_amds_cohort_historical_closure
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  custody_and_value_bound_evidence:
    name: 01-10 Batch093 custody, expected-red, RPIR v2.1, and value-bound evidence
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install pytest build wheel setuptools packaging
      - name: Enforce the non-actuating dispatch contract
        shell: bash
        run: |
          if [[ "${{ inputs.run_historical_actuation }}" == "true" || -n "${{ inputs.cloudpickle_patch_confirmation }}" || -n "${{ inputs.freezegun_patch_confirmation }}" || -n "${{ inputs.authorization_scope_confirmation }}" ]]; then
            echo "HUMAN_AUTHORIZATION_BLOCKED_EXACT: Batch094 authorizes evidence execution only"
            exit 1
          fi
      - name: Retrieve and independently verify the exact official Batch093 artifact
        run: |
          RUNTIME="$RUNNER_TEMP/controllergate-runtime/batch094"
          mkdir -p "$RUNTIME/inputs"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/8363847950/zip" \
            -o "$RUNTIME/inputs/batch093.zip"
          python scripts/batch094_ingest_and_reconcile_batch093.py --artifact "$RUNTIME/inputs/batch093.zip" --output "$OUTPUT"
      - name: Verify sealed expected-red and frozen exact-release/value-bound evidence
        run: |
          python - <<'PY'
          import json, os, pathlib
          record = json.loads((pathlib.Path(os.environ["OUTPUT"]) / "batch094_pre_fix_value_bound_rpir_and_fresh_cohort_expected_failure.json").read_text())
          assert record["status"] == "BATCH094_PRE_FIX_AUDIT_FAIL_EXPECTED"
          assert record["finding_count"] == 11
          assert record["audit_hash"] == "6851f77437f6ba3f65c9b289558dca1cfcb1007be139f1bfde6949a3b5926eda"
          PY
          python -m pytest tests/test_batch094_rpir_v21.py tests/test_batch094_value_bound_behavior.py -q
          python scripts/audit_canonical_component_uniqueness.py
          python scripts/audit_no_batch_core_logic.py
          python scripts/audit_public_language.py
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: batch094_custody_reconciliation_evidence
          path: |
            ${{ env.OUTPUT }}/batch093_artifact_ingest.json
            ${{ env.OUTPUT }}/batch093_artifact_sha256_verification.json
            ${{ env.OUTPUT }}/batch093_artifact_manifest_verification.json
            ${{ env.OUTPUT }}/batch093_raw_evidence_preservation.json
            ${{ env.OUTPUT }}/batch093_source_member_manifest_correction.json
            ${{ env.OUTPUT }}/batch093_reactome_claim_correction.json
            ${{ env.OUTPUT }}/batch093_installed_depth_correction.json
            ${{ env.OUTPUT }}/batch093_primitive_depth_correction.json
            ${{ env.OUTPUT }}/batch093_critic_depth_correction.json
            ${{ env.OUTPUT }}/batch093_external_depth_reconciliation.json
            ${{ env.OUTPUT }}/batch093_current_authority_exclusion_registry.jsonl
          retention-days: 1

  fresh_frozen_cohort:
    name: 11-20 exact frozen cohort acquisition and minimum-cohort gate
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Enable preserved historical paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install pytest build wheel setuptools packaging
      - name: Execute exact frozen acquisition with no candidate substitution
        shell: pwsh
        run: |
          python scripts/run_batch094_fresh_cohort.py `
            --runtime-root "$env:RUNNER_TEMP\controllergate-runtime\batch094" `
            --output "$env:OUTPUT"
          python scripts/finalize_batch094_scientific_gates.py
          python -m pytest tests/test_batch094_fresh_cohort.py tests/test_batch094_blocked_scientific_gates.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: batch094_fresh_frozen_cohort_evidence
          path: |
            ${{ env.OUTPUT }}/fresh_cohort_*.json
            ${{ env.OUTPUT }}/historical_*.json
            ${{ env.OUTPUT }}/historical_*.jsonl
            ${{ env.OUTPUT }}/role_*.json
            ${{ env.OUTPUT }}/amds_historical_quality_gate_v3.json
            ${{ env.OUTPUT }}/external_human_authorization_gate.json
            ${{ env.OUTPUT }}/batch094_downstream_gate_status.json
          retention-days: 1

  installed_linux:
    name: 21-25 Linux installed-wheel value-bound CLI execution
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install build wheel setuptools packaging
      - name: Build, install, and execute through the canonical CLI
        run: |
          python scripts/run_batch094_installed_cli.py \
            --repo "$GITHUB_WORKSPACE" \
            --runtime-root "$RUNNER_TEMP/controllergate-runtime" \
            --output "$GITHUB_WORKSPACE/$OUTPUT" \
            --platform linux
      - uses: actions/upload-artifact@v4
        with:
          name: batch094_installed_linux_evidence
          path: |
            ${{ env.OUTPUT }}/*_linux*.json
            ${{ env.OUTPUT }}/*_linux*.jsonl
          retention-days: 1

  installed_windows:
    name: 26-30 Windows installed-wheel value-bound CLI execution
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Enable preserved historical paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install build wheel setuptools packaging
      - name: Build, install, and execute through the canonical CLI
        shell: pwsh
        run: |
          python scripts/run_batch094_installed_cli.py `
            --repo "$env:GITHUB_WORKSPACE" `
            --runtime-root "$env:RUNNER_TEMP\controllergate-runtime" `
            --output "$env:GITHUB_WORKSPACE\$env:OUTPUT" `
            --platform windows
      - uses: actions/upload-artifact@v4
        with:
          name: batch094_installed_windows_evidence
          path: |
            ${{ env.OUTPUT }}/*_windows*.json
            ${{ env.OUTPUT }}/*_windows*.jsonl
          retention-days: 1

  critic_and_compact_handoff:
    name: 31-46 cross-platform join, raw critic, preservation, and compact handoff
    needs: [custody_and_value_bound_evidence, fresh_frozen_cohort, installed_linux, installed_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install pytest build wheel setuptools packaging
      - uses: actions/download-artifact@v4
        with: {name: batch094_custody_reconciliation_evidence, path: joined/custody}
      - uses: actions/download-artifact@v4
        with: {name: batch094_fresh_frozen_cohort_evidence, path: joined/cohort}
      - uses: actions/download-artifact@v4
        with: {name: batch094_installed_linux_evidence, path: joined/linux}
      - uses: actions/download-artifact@v4
        with: {name: batch094_installed_windows_evidence, path: joined/windows}
      - name: Join actual job evidence and reconstruct the release boundary
        run: |
          find joined -maxdepth 2 -type f -exec cp {} "$OUTPUT/" \;
          python scripts/finalize_batch094_installed_evidence.py --output "$OUTPUT"
          python scripts/finalize_batch094_scientific_gates.py
          python scripts/batch094_standalone_critic.py --output "$OUTPUT" --workspace "$RUNNER_TEMP/controllergate-runtime/batch094/critic-mutations"
          python scripts/finalize_batch094.py --repo . --output "$OUTPUT"
      - name: Complete tests and Batch073-Batch093 preservation audits
        run: |
          python -m pytest -q
          python scripts/audit_batch073_count5_revalidation_frozen_wave1.py
          python scripts/audit_batch074_sterile_high_yield_amds_memory_wave1.py
          python scripts/audit_batch075_provider_harness_amds_memory_wave1a.py
          python scripts/audit_batch076_amds_causal_memory_calibration.py
          python scripts/audit_batch077_typed_event_pathway_memory_v2.py
          python scripts/audit_batch078_count6_minimal_closure_memory_wave1b.py
          python scripts/audit_batch079_count6_runtime_incident_memory_wave1c.py
          python scripts/audit_batch080_executed_preflight_provider_memory_wave1d.py
          python scripts/audit_batch081_execution_constitution_provider_incident_pilot.py
          python scripts/audit_batch082_ci_native_maintenance_order_provider_wave1f.py --output outputs/post_v2_37_hardening_batch082_ci_native_maintenance_order_provider_wave1f
          python scripts/audit_batch083_reaction_product_cross_area_wave1g.py --out outputs/post_v2_37_hardening_batch083_reaction_product_cross_area_wave1g
          python scripts/audit_batch084_real_amds_canary_product_beta.py --out outputs/post_v2_37_hardening_batch084_real_amds_canary_product_beta
          python scripts/audit_batch085_canonical_kernel_product_beta_rc.py
          python scripts/audit_batch086_historical_lifecycle_dpp14_product_beta_rc.py
          python scripts/audit_batch087_canonical_execution_blind_dpp14_product_beta_revalidation.py --verify-only
          python scripts/audit_batch088_causal_amds_historical_capsule_product_beta_closure.py
          python scripts/audit_batch089_full_isomorphism_reaction_complete_vertical_closure.py --verify-manifests
          python scripts/audit_batch090_evidence_delaundering_installed_vertical_closure.py --official-reconciliation
          python scripts/audit_batch091_lossless_capsule_blinded_amds_historical_canary_semantic_critic_closure.py
          python scripts/audit_batch092_reactome_complete_pathway_ir_external_review_correction.py
          python scripts/audit_batch093_structured_rpir_executable_isomorphism_amds_role_cohort_closure.py
      - name: Current authority, custody, security, and Batch094 audit
        run: |
          python scripts/audit_v2_18_evidence_derived_topology_historical_provider.py
          python scripts/audit_v2_19_authorized_amds_active_maintenance.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          python scripts/audit_canonical_component_uniqueness.py
          python scripts/audit_no_batch_core_logic.py
          python scripts/audit_installed_product_reachability.py
          python scripts/audit_no_legacy_production_imports.py
          python scripts/audit_external_operation_boundaries.py
          python scripts/audit_public_language.py
          python scripts/audit_batch089_security_and_sbom.py --verify-only
          python scripts/audit_batch094_value_bound_rpir_fresh_amds_cohort_historical_closure.py --require-cross-platform
          python scripts/byte_custody_preflight.py
          git diff --check
      - name: Stage the compact semantically scoped artifact
        run: |
          python scripts/stage_batch094_artifact.py \
            --repo . \
            --output "$OUTPUT" \
            --stage "$RUNNER_TEMP/batch094-main"
      - uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch094_value_bound_rpir_fresh_amds_cohort_historical_closure_artifacts
          path: ${{ runner.temp }}/batch094-main
