name: controllergate_generic_maintenance

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative credential-free maintenance manifest
        required: true
        default: examples/product_alpha_fixture/product_alpha_manifest.json

permissions:
  contents: read

jobs:
  controlled-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e .
      - run: controllergate doctor --runtime-root "$RUNNER_TEMP/controllergate-runtime"
      - name: Bind the manifest to the authoritative runner runtime
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source=Path(os.environ['MANIFEST']); value=json.loads(source.read_text())
          value['fixture_root']=str((Path.cwd()/value['fixture_root']).resolve())
          value['runtime_root']=str(Path(os.environ['RUNNER_TEMP'])/'controllergate-runtime')
          Path(os.environ['RUNNER_TEMP']).joinpath('controllergate-manifest.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
      - run: controllergate run --manifest "$RUNNER_TEMP/controllergate-manifest.json"
      - run: controllergate verify --run-id product-alpha-controlled-cycle --manifest "$RUNNER_TEMP/controllergate-manifest.json"
