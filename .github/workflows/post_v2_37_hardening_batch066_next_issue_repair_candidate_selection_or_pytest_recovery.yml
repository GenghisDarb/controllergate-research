name: post_v2_37_hardening_batch066_next_issue_repair_candidate_selection_or_pytest_recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch066-next-issue-repair-candidate-selection-or-pytest-recovery:
    name: Batch066 next issue-repair candidate selection or Pytest recovery validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      OUT_NAME: post_v2_37_hardening_batch066_next_issue_repair_candidate_selection_or_pytest_recovery

    steps:
      - name: Checkout ControllerGate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run byte-custody preflight before validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Install workflow test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run shared core and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/core tests/runtime -q

      - name: Validate registry, Batch066 audit, prior audits, and current protocol
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_external_candidate_registry.py
          python scripts/audit_batch066_next_issue_repair_candidate_selection_or_pytest_recovery.py
          git diff --check
          python - <<'PY'
          import json
          root = "outputs/post_v2_37_hardening_batch066_next_issue_repair_candidate_selection_or_pytest_recovery"
          final = json.load(open(f"{root}/batch066_final_decision.json", encoding="utf-8"))
          print(f"batch066_status={final.get('status')}")
          print(f"batch065_ingest_status={final.get('batch065_ingest_status')}")
          print(f"current_protocol={final.get('current_protocol')}")
          print(f"issue_derived_repair_count={final.get('issue_derived_repair_count')}")
          print(f"native_external_repair_count={final.get('native_external_repair_count')}")
          print(f"pytest_command_boundary_classification={final.get('pytest_command_boundary_classification')}")
          print(f"pytest_provider_runtime_setup_status={final.get('pytest_provider_runtime_setup_status')}")
          print(f"pytest_prerepair_replay_classification={final.get('pytest_prerepair_replay_classification')}")
          print(f"pytest_future_patch_license_state={final.get('pytest_future_patch_license_state')}")
          print(f"repo_hygiene_pressure_status={final.get('repo_hygiene_pressure_status')}")
          print(f"recommended_next_proof_path={final.get('recommended_next_proof_path')}")
          print(f"project_health_grade={final.get('project_health_grade')}")
          print(f"traffic_light_status={final.get('traffic_light_status')}")
          print(f"distance_to_issue_derived_repair_count_5={final.get('distance_to_issue_derived_repair_count_5')}")
          print(f"distance_to_self_maintaining_claim={final.get('distance_to_self_maintaining_claim')}")
          print(f"next_allowed_action={final.get('next_allowed_action')}")
          print(f"full_scoring={final.get('full_scoring')}")
          print(f"memory_lift={final.get('memory_lift')}")
          print(f"self_maintaining_software={final.get('self_maintaining_software')}")
          print(f"exact_blocker={final.get('exact_blocker')}")
          PY

      - name: Stage clean Batch066 artifact payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "artifact_payload/${OUT_NAME}"
          mkdir -p "artifact_payload/${OUT_NAME}"
          cp -a "outputs/${OUT_NAME}/." "artifact_payload/${OUT_NAME}/"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path("artifact_payload") / os.environ["OUT_NAME"]
          rows = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "ARTIFACT_SHA256SUMS.txt":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  rows.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "ARTIFACT_SHA256SUMS.txt").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          test -f "artifact_payload/${OUT_NAME}/ARTIFACT_SHA256SUMS.txt"
          if find "artifact_payload/${OUT_NAME}" \( \
            -path '*/__pycache__/*' -o \
            -path '*/.pytest_cache/*' -o \
            -path '*/.mypy_cache/*' -o \
            -path '*/.ruff_cache/*' -o \
            -path '*/.venv/*' -o \
            -path '*/venv/*' -o \
            -path '*/env/*' -o \
            -path '*/ENV/*' -o \
            -name '*.pyc' -o \
            -name '*.pyo' -o \
            -name '*.zip' -o \
            -name '*.tar' -o \
            -name '*.tar.gz' -o \
            -name '*.tgz' -o \
            -name '*.7z' -o \
            -name '*.whl' \
          \) -print -quit | grep -q .; then
            echo "artifact_packaging_forbidden_payload_detected"
            exit 1
          fi

      - name: Upload Batch066 next issue-repair candidate selection or Pytest recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch066_next_issue_repair_candidate_selection_or_pytest_recovery_artifacts
          path: |
            artifact_payload/post_v2_37_hardening_batch066_next_issue_repair_candidate_selection_or_pytest_recovery/**
          if-no-files-found: error
