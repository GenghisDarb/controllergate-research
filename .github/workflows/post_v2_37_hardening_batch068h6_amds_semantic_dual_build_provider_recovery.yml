name: post_v2_37_hardening_batch068h6_amds_semantic_dual_build_provider_recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amds-semantic-dual-build-provider-recovery:
    name: Batch068h6 semantic integrity and provider recovery
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout ControllerGate
        uses: actions/checkout@v4

      - name: Verify workflow head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest packaging

      - name: Run byte-custody preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/byte_custody_preflight.py

      - name: Verify Batch068h5 and execute the ordered Batch068h6 lane
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_batch068h6_amds_semantic_dual_build_provider_recovery.py

      - name: Run focused Batch068h6 tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/runtime/test_batch068h6_amds_semantic_dual_provider.py -q

      - name: Run complete core and runtime tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/core tests/runtime -q

      - name: Run Batch068h6 audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_batch068h6_amds_semantic_dual_build_provider_recovery.py

      - name: Run Batch068h5 preservation audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_batch068h5_amds_build_provider_recovery_fifth_repair.py

      - name: Run registry-driven regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_external_candidate_registry.py
          python scripts/run_controllergate_regression_audits.py --registry configs/controllergate_regression_audit_registry.json

      - name: Run v2.18 preservation and current protocol checks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_v2_18_evidence_derived_topology_historical_provider.py
          python scripts/controllergate_audit.py --protocol current
          python scripts/controllergate_run.py --protocol current --dry-run
          python scripts/controllergate_frontier.py status
          python scripts/controllergate_frontier.py validate

      - name: Verify public claim boundary and repository diff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_batch068h6_amds_semantic_dual_build_provider_recovery.py
          git diff --check

      - name: Stage compact, allowlisted artifact payload
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stage_controllergate_artifact.py \
            --destination "$RUNNER_TEMP/controllergate_artifact" \
            --source "outputs/post_v2_37_hardening_batch068h6_amds_semantic_dual_build_provider_recovery" \
            --source "outputs/current" \
            --source "outputs/frontier" \
            --source "docs/CURRENT_FRONTIER_STATUS.md" \
            --source "docs/EVIDENCE_RETENTION_AND_MIGRATION.md" \
            --source "configs/controllergate_current.yaml" \
            --source "configs/controllergate_frontier.yaml" \
            --source "configs/controllergate_v2_18_evidence_derived_topology_historical_provider.yaml" \
            --source "configs/controllergate_regression_audit_registry.json"
          if find "$RUNNER_TEMP/controllergate_artifact" -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.whl' -o -name '*.zip' -o -name '*.tar' -o -name '*.tgz' \) | grep -q .; then
            echo "forbidden artifact payload detected" >&2
            exit 1
          fi
          if find "$RUNNER_TEMP/controllergate_artifact" -type d \( -name '__pycache__' -o -name '.venv' -o -name 'venv' \) | grep -q .; then
            echo "forbidden artifact directory detected" >&2
            exit 1
          fi

      - name: Upload Batch068h6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: post_v2_37_hardening_batch068h6_amds_semantic_dual_build_provider_recovery_artifacts
          path: ${{ runner.temp }}/controllergate_artifact/**
          if-no-files-found: error
