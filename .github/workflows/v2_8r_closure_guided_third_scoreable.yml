name: v2_8r_closure_guided_third_scoreable

on:
  workflow_dispatch:

jobs:
  closure-guided-third-scoreable:
    name: Closure-guided third scoreable recovery
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout ControllerGate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify v2.8r runner revision
        shell: bash
        run: |
          set -euo pipefail
          grep -q "v2_8q_bugsinpy_preflight_guided_third_scoreable_runner" scripts/v2_8r_closure_guided_third_scoreable_runner.py
          grep -q "v2_8r_closure_guided_third_scoreable_artifacts" scripts/v2_8r_closure_guided_third_scoreable_runner.py
          grep -q "candidate_chromatin_state_v2_8r" scripts/v2_8r_closure_guided_third_scoreable_runner.py
          grep -q "local_tension_relief_v2_8r" scripts/v2_8r_closure_guided_third_scoreable_runner.py
          grep -q "minimal_probe_selection_v2_8r" scripts/v2_8r_closure_guided_third_scoreable_runner.py
          grep -q "candidate_triage_stability_audit_v2_8r" scripts/v2_8r_closure_guided_third_scoreable_runner.py
          grep -q "closure_scaling_audit" scripts/v2_8r_closure_guided_third_scoreable_runner.py
          grep -q "memory_lift_decomposition" scripts/v2_8r_closure_guided_third_scoreable_runner.py
          grep -q "project_root / \"lib\"" scripts/v2_8q_bugsinpy_preflight_guided_third_scoreable_runner.py
          grep -q "v28j.source_diff" scripts/v2_8q_bugsinpy_preflight_guided_third_scoreable_runner.py
          grep -q "localized_deterministic_missing_argument_order" scripts/v2_8q_bugsinpy_preflight_guided_third_scoreable_runner.py

      - name: Run closure-guided third scoreable runner
        shell: bash
        timeout-minutes: 100
        run: |
          set -euo pipefail
          python scripts/v2_8r_closure_guided_third_scoreable_runner.py
          test -s v2_8r_closure_guided_third_scoreable_artifacts/preserved_reference_gate_result.json
          test -s v2_8r_closure_guided_third_scoreable_artifacts/harness_sanity_check.json
          test -s v2_8r_closure_guided_third_scoreable_artifacts/command_normalization_policy.json
          test -s v2_8r_closure_guided_third_scoreable_artifacts/candidate_triage_report.json
          test -s v2_8r_closure_guided_third_scoreable_artifacts/candidate_chromatin_state_v2_8r.json
          test -s v2_8r_closure_guided_third_scoreable_artifacts/local_tension_relief_v2_8r.json
          test -s v2_8r_closure_guided_third_scoreable_artifacts/minimal_probe_selection_v2_8r.json
          test -s v2_8r_closure_guided_third_scoreable_artifacts/candidate_triage_stability_audit_v2_8r.json
          test -s v2_8r_closure_guided_third_scoreable_artifacts/closure_scaling_audit.json
          test -s v2_8r_closure_guided_third_scoreable_artifacts/memory_lift_decomposition.json

      - name: Upload v2.8r closure-guided third scoreable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2_8r_closure_guided_third_scoreable_artifacts
          path: v2_8r_closure_guided_third_scoreable_artifacts
          if-no-files-found: error
