[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controllergate"
version = "0.2.0b2.dev0"
description = "Evidence-bound software maintenance research runtime"
requires-python = ">=3.11"
dependencies = ["packaging>=23"]

[project.scripts]
controllergate = "controllergate.cli:main"

[tool.setuptools.packages.find]
include = ["controllergate*"]
