[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controllergate"
version = "0.1.0a1"
description = "Evidence-bound software maintenance research runtime"
requires-python = ">=3.11"

[project.scripts]
controllergate = "controllergate.cli:main"

[tool.setuptools.packages.find]
include = ["controllergate*"]
